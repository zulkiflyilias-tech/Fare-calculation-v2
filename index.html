<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Driver Fare Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 180px; border-radius: 12px; }
        .search-results { 
            position: absolute; z-index: 2000; width: 100%; 
            background: #0f172a; border: 1px solid #334155; 
            border-radius: 8px; max-height: 250px; overflow-y: auto; 
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7); 
        }
        .result-item { padding: 12px; border-bottom: 1px solid #1e293b; cursor: pointer; transition: background 0.2s; }
        .result-item:hover { background: #1e293b; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-black text-yellow-500 underline">PRO FARE AI</h1>
            <p id="clock" class="text-[10px] font-mono text-slate-400 uppercase tracking-widest"></p>
        </div>
        <button onclick="location.reload()" class="bg-slate-800 text-[10px] px-3 py-2 rounded-lg border border-slate-700 active:bg-red-900">RESET SYSTEM</button>
    </div>

    <div id="map" class="mb-4 border border-slate-800"></div>

    <div class="space-y-3 relative">
        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Pickup Point</label>
            <div class="flex gap-2">
                <input id="pickup" type="text" oninput="searchLoc(this.value, 'pickup')" class="flex-1 bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Search Street/Building...">
                <button onclick="getGPS()" class="bg-blue-600 px-4 rounded-lg">📍</button>
            </div>
            <div id="pickup-results" class="search-results hidden"></div>
        </div>

        <div class="flex justify-center -my-2 relative z-10">
            <button onclick="swapLocations()" class="bg-slate-800 p-2 rounded-full border border-slate-700 shadow-lg active:rotate-180 transition-transform duration-300">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5zm-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5z"/></svg>
            </button>
        </div>

        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Destination</label>
            <input id="destination" type="text" oninput="searchLoc(this.value, 'dest')" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Search Street/Building...">
            <div id="dest-results" class="search-results hidden"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Travel Time</label>
                <input id="schedule" type="datetime-local" onchange="calculate()" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-yellow-500">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Manual Tolls (RM)</label>
                <input id="tolls" type="number" oninput="calculate()" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-sm text-right" value="0.00" step="0.10">
            </div>
        </div>
    </div>

    <div id="result-card" class="hidden mt-6 p-5 rounded-2xl bg-gradient-to-br from-slate-900 to-black border-2 border-yellow-500/30">
        <div class="text-center mb-4">
            <p id="trip-type" class="text-[9px] font-bold text-yellow-500 uppercase tracking-widest"></p>
            <h2 id="final-price" class="text-6xl font-black text-white">RM 0.00</h2>
        </div>
        
        <div class="space-y-2 text-xs border-t border-slate-800 pt-4">
            <div class="flex justify-between"><span>Distance / Time</span><span id="dist-label" class="font-bold text-slate-100"></span></div>
            <div class="flex justify-between"><span>Base + Km (RM1.25)</span><span id="base-km-label"></span></div>
            <div class="flex justify-between"><span>Traffic & Peak Adjust.</span><span id="peak-label"></span></div>
            <div class="flex justify-between text-yellow-500 font-bold italic"><span>Auto-Deadhead (Return)</span><span id="dh-label"></span></div>
            <div class="flex justify-between"><span>Tolls & Zone Fees</span><span id="toll-label"></span></div>
        </div>
    </div>

    <script>
        let map = L.map('map', {zoomControl: false}).setView([3.139, 101.686], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let uLat, uLon, dLat, dLon, markers = L.layerGroup().addTo(map);

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('schedule').value = now.toISOString().slice(0,16);

        async function searchLoc(q, type) {
            if (q.length < 3) return;
            // Bias results toward Central Malaysia (Selangor/KL)
            const res = await fetch(`https://photon.komoot.io/api/?q=${q}&lat=3.13&lon=101.6&limit=6`);
            const data = await res.json();
            const resDiv = document.getElementById(type + '-results');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = data.features.map(f => {
                const p = f.properties;
                // Extended Malaysian Address Format
                const main = p.name || "Unknown Point";
                const sub = [p.street, p.district, p.city, p.state].filter(x => x).join(', ');
                return `
                <div class="result-item" onclick="select('${type}', ${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}, '${main}', '${sub}')">
                    <div class="font-bold text-yellow-500">${main}</div>
                    <div class="text-[10px] text-slate-400 leading-tight mt-1">${sub}</div>
                </div>`;
            }).join('');
        }

        function select(type, lat, lon, name, sub) {
            if (type === 'pickup') { uLat = lat; uLon = lon; document.getElementById('pickup').value = name; }
            else { dLat = lat; dLon = lon; document.getElementById('destination').value = name; }
            document.querySelectorAll('.search-results').forEach(el => el.classList.add('hidden'));
            calculate();
        }

        async function getGPS() {
            navigator.geolocation.getCurrentPosition(async pos => {
                uLat = pos.coords.latitude; uLon = pos.coords.longitude;
                map.setView([uLat, uLon], 15);
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${uLat}&lon=${uLon}`);
                const data = await res.json();
                document.getElementById('pickup').value = data.display_name.split(',').slice(0,3).join(',');
                calculate();
            });
        }

        function swapLocations() {
            [uLat, dLat] = [dLat, uLat]; [uLon, dLon] = [dLon, uLon];
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('destination').value;
            document.getElementById('pickup').value = d;
            document.getElementById('destination').value = p;
            calculate();
        }

        async function calculate() {
            if (!uLat || !dLat) return;
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${uLon},${uLat};${dLon},${dLat}`);
            const data = await res.json();
            if (data.code !== 'Ok') return;

            const dist = data.routes[0].distance / 1000;
            const mins = data.routes[0].duration / 60;
            
            let base = 8.00;
            let baseFare = base + (dist * 1.25);
            let speed = dist / (mins / 60);
            let trafficMult = speed < 20 ? 1.35 : (speed < 40 ? 1.15 : 1.0);

            let Sched = new Date(document.getElementById('schedule').value);
            let hr = Sched.getHours(), day = Sched.getDay();
            let peakMult = ((hr >= 7 && hr <= 10) || (hr >= 17 && hr <= 20)) ? 1.15 : 1.0;
            if (day === 5 && hr >= 12) peakMult = 1.25;

            let dhMult = (dist > 80) ? 1.35 : 1.0;
            let manualToll = parseFloat(document.getElementById('tolls').value) || 0;
            let estToll = dist > 30 ? (dist * 0.12) : 0;
            let zoneFee = (dLat < 3.16 && dLat > 3.12 && dLon > 101.69 && dLon < 101.72) ? 5.00 : 0;

            let subtotal = baseFare * trafficMult * peakMult * dhMult;
            let final = subtotal + manualToll + estToll + zoneFee;

            markers.clearLayers();
            L.marker([uLat, uLon]).addTo(markers);
            L.marker([dLat, dLon]).addTo(markers);
            map.fitBounds(new L.featureGroup([L.marker([uLat, uLon]), L.marker([dLat, dLon])]).getBounds().pad(0.3));

            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('trip-type').innerText = dhMult > 1 ? "Interstate / Remote" : "Urban / Local";
            document.getElementById('final-price').innerText = `RM ${final.toFixed(2)}`;
            document.getElementById('dist-label').innerText = `${dist.toFixed(1)}km / ${Math.round(mins)}m`;
            document.getElementById('base-km-label').innerText = `RM ${baseFare.toFixed(2)}`;
            document.getElementById('peak-label').innerText = `x${(trafficMult * peakMult).toFixed(2)} (${Math.round(speed)}km/h)`;
            document.getElementById('dh-label').innerText = dhMult > 1 ? "AUTO-ACTIVE (+35%)" : "N/A";
            document.getElementById('toll-label').innerText = `RM ${(manualToll + estToll + zoneFee).toFixed(2)}`;
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString('en-MY'); }, 1000);
        getGPS();
    </script>
</body>
</html>
