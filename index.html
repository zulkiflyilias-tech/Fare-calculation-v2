<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Sedan Logic Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 180px; border-radius: 12px; filter: grayscale(0.2) contrast(1.1); }
        .search-results { 
            position: absolute; z-index: 2000; width: 100%; 
            background: #0f172a; border: 1px solid #334155; 
            border-radius: 8px; max-height: 250px; overflow-y: auto; 
        }
        .result-item { padding: 12px; border-bottom: 1px solid #1e293b; cursor: pointer; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-black text-yellow-500 tracking-tighter">PREMIUM SEDAN LOGIC</h1>
            <p id="clock" class="text-[10px] font-mono text-slate-400"></p>
        </div>
        <button onclick="location.reload()" class="text-[10px] text-slate-500 border border-slate-800 px-2 py-1 rounded">REFRESH</button>
    </div>

    <div id="map" class="mb-4 border border-slate-800 shadow-lg"></div>

    <div class="space-y-3 relative">
        <div class="relative">
            <div class="flex gap-2">
                <input id="pickup" type="text" oninput="searchLoc(this.value, 'pickup')" class="flex-1 bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Pickup Location">
                <button onclick="getGPS()" class="bg-blue-600 px-4 rounded-lg active:scale-90 transition-transform">📍</button>
            </div>
            <div id="pickup-results" class="search-results hidden"></div>
        </div>

        <div class="flex justify-center -my-2 relative z-10">
            <button onclick="swapLocations()" class="bg-slate-800 p-2 rounded-full border border-slate-700 shadow-xl active:bg-yellow-500 active:text-black transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5zm-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5z"/></svg>
            </button>
        </div>

        <div class="relative">
            <input id="destination" type="text" oninput="searchLoc(this.value, 'dest')" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Destination">
            <div id="dest-results" class="search-results hidden"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <input id="schedule" type="datetime-local" onchange="calculate()" class="bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-yellow-500 font-bold">
            <div class="bg-slate-900 border border-slate-800 p-2 rounded-lg flex items-center px-3">
                <span class="text-[10px] text-slate-500 font-bold mr-2">EXTRA TOLL</span>
                <input id="tolls" type="number" oninput="calculate()" class="w-full bg-transparent text-right text-sm outline-none" value="0.00" step="0.10">
            </div>
        </div>
    </div>

    <div id="result-card" class="hidden mt-6 p-6 rounded-3xl bg-gradient-to-br from-slate-900 via-slate-900 to-black border-t border-slate-700 shadow-[0_20px_50px_rgba(0,0,0,0.5)]">
        <div class="text-center mb-6">
            <p id="trip-type" class="text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1"></p>
            <h2 id="final-price" class="text-7xl font-black text-white tracking-tighter">RM 0</h2>
            <p class="text-[10px] text-slate-500 mt-1 uppercase">Rounded to nearest 10 sen</p>
        </div>
        
        <div class="space-y-3 text-[11px] border-t border-slate-800 pt-5">
            <div class="flex justify-between">
                <span class="text-slate-500 uppercase font-bold">Distance & Time</span>
                <span id="dist-label" class="text-slate-100 font-mono font-bold"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-500 uppercase font-bold">Base Fare + Distance</span>
                <span id="base-km-label" class="text-slate-100 font-mono"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-500 uppercase font-bold">Traffic & Schedule Adj.</span>
                <span id="peak-label" class="text-slate-100 font-mono"></span>
            </div>
            <div class="flex justify-between text-yellow-500 font-bold italic">
                <span>Auto-Deadhead Surcharge</span>
                <span id="dh-label"></span>
            </div>
            <div class="flex justify-between">
                <span class="text-slate-500 uppercase font-bold">Auto-Highway Tolls</span>
                <span id="toll-label" class="text-green-400 font-mono font-bold"></span>
            </div>
        </div>
    </div>

    <script>
        let map = L.map('map', {zoomControl: false}).setView([3.13, 101.68], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let uLat, uLon, dLat, dLon, markers = L.layerGroup().addTo(map);

        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('schedule').value = now.toISOString().slice(0,16);

        async function searchLoc(q, type) {
            if (q.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${q}&lat=3.13&lon=101.6&limit=6`);
            const data = await res.json();
            const resDiv = document.getElementById(type + '-results');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = data.features.map(f => {
                const p = f.properties;
                const main = p.name || "Place";
                const sub = [p.street, p.city, p.state].filter(x => x).join(', ');
                return `<div class="p-3 border-b border-slate-800 text-xs cursor-pointer" onclick="select('${type}', ${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}, '${main}')">
                    <div class="font-bold text-yellow-500">${main}</div><div class="text-[10px] text-slate-500">${sub}</div>
                </div>`;
            }).join('');
        }

        function select(type, lat, lon, name) {
            if (type === 'pickup') { uLat = lat; uLon = lon; document.getElementById('pickup').value = name; }
            else { dLat = lat; dLon = lon; document.getElementById('destination').value = name; }
            document.querySelectorAll('.search-results').forEach(el => el.classList.add('hidden'));
            calculate();
        }

        function swapLocations() {
            [uLat, dLat] = [dLat, uLat]; [uLon, dLon] = [dLon, uLon];
            const p = document.getElementById('pickup').value;
            const d = document.getElementById('destination').value;
            document.getElementById('pickup').value = d;
            document.getElementById('destination').value = p;
            calculate();
        }

        async function getGPS() {
            navigator.geolocation.getCurrentPosition(async pos => {
                uLat = pos.coords.latitude; uLon = pos.coords.longitude;
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${uLat}&lon=${uLon}`);
                const data = await res.json();
                document.getElementById('pickup').value = data.display_name.split(',').slice(0,3).join(',');
                calculate();
            });
        }

        async function calculate() {
            if (!uLat || !dLat) return;
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${uLon},${uLat};${dLon},${dLat}`);
            const data = await res.json();
            if (data.code !== 'Ok') return;

            const dist = data.routes[0].distance / 1000;
            const mins = data.routes[0].duration / 60;
            
            // Core Formula Fundamentals
            let baseRate = 8.00;
            let perKmCost = 1.25;
            let baseFare = baseRate + (dist * perKmCost);
            
            // Traffic Index Analysis (Speed-to-Delay Ratio)
            let speed = dist / (mins / 60);
            let trafficMult = 1.0;
            if (speed < 20) {
                trafficMult = 1.35; // Severe Gridlock
            } else if (speed < 40) {
                trafficMult = 1.15; // Moderate urban congestion
            }
            
            // Scheduling Peak Modifier
            let Sched = new Date(document.getElementById('schedule').value);
            let hr = Sched.getHours();
            let day = Sched.getDay();
            let peakMult = 1.0;
            
            if (day === 5 && hr >= 12) {
                peakMult = 1.25; // Friday Afternoon Surge Priority
            } else if ((hr >= 7 && hr <= 10) || (hr >= 17 && hr <= 20)) {
                peakMult = 1.15; // Standard Daily Peak Window
            }

            // Boundary Crossings & Deadhead Index
            let dhMult = (dist > 80) ? 1.35 : 1.0;

            // Highway Toll Structuring
            let autoToll = dist > 20 ? (dist * 0.15) : 0;
            let manualToll = parseFloat(document.getElementById('tolls').value) || 0;

            // Mathematical Aggregation
            let subtotal = (baseFare * trafficMult * peakMult * dhMult);
            let finalUnrounded = subtotal + autoToll + manualToll;

            // Currency Standardization Rounding Logic (10 Sen Precision)
            let roundedFinal = (Math.round(finalUnrounded * 10) / 10).toFixed(2);

            // Rendering Output to DOM
            markers.clearLayers();
            L.marker([uLat, uLon]).addTo(markers); L.marker([dLat, dLon]).addTo(markers);
            map.fitBounds(new L.featureGroup([L.marker([uLat, uLon]), L.marker([dLat, dLon])]).getBounds().pad(0.3));

            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('trip-type').innerText = dhMult > 1 ? "Long Distance / Interstate" : "Urban / Local Trip";
            document.getElementById('final-price').innerText = `RM ${roundedFinal}`;
            
            // Formatted Sublabels Matching Verification Breakdown
            let hoursText = mins >= 60 ? `${Math.floor(mins / 60)} hr ${Math.round(mins % 60)} mins` : `${Math.round(mins)} mins`;
            document.getElementById('dist-label').innerText = `${dist.toFixed(1)} km / ${hoursText}`;
            document.getElementById('base-km-label').innerText = `RM ${baseFare.toFixed(2)} (Base RM8 + RM1.25/km)`;
            document.getElementById('peak-label').innerText = `x${(trafficMult * peakMult).toFixed(2)} (${Math.round(speed)} km/h avg)`;
            document.getElementById('dh-label').innerText = dhMult > 1 ? "ACTIVE (+35% Interstate Recovery)" : "N/A (Local Zone)";
            document.getElementById('toll-label').innerText = `RM ${(autoToll + manualToll).toFixed(2)} (Auto-estimated)`;
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString('en-MY'); }, 1000);
        getGPS();
    </script>
</body>
</html>
