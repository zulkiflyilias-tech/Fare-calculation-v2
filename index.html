<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Driver Fare Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black text-yellow-500">AUTO-FARE AI</h1>
            <p class="text-[10px] text-slate-400 uppercase tracking-widest">Self-Adjusting Logic</p>
        </div>
        <div class="text-right">
            <p id="clock" class="text-xs font-mono text-yellow-500"></p>
        </div>
    </div>

    <div id="map" class="h-40 rounded-xl mb-4 border border-slate-800 shadow-2xl"></div>

    <div class="space-y-4">
        <div class="flex gap-2">
            <input id="pickup" type="text" class="flex-1 bg-slate-900 border border-slate-800 p-3 rounded-lg text-xs" placeholder="Pickup Address...">
            <button onclick="getCurrentLocation()" class="bg-blue-600 px-4 rounded-lg">📍</button>
        </div>
        <input id="destination" type="text" oninput="searchLocation(this.value)" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-xs" placeholder="Search Destination...">
        <div id="search-results" class="absolute z-[1000] w-[90%] bg-slate-800 rounded-lg max-h-40 overflow-y-auto"></div>

        <button onclick="calculateFinalFare()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-xl shadow-lg active:scale-95 transition-transform">
            GENERATE SMART QUOTE
        </button>
    </div>

    <div id="result-card" class="hidden mt-6 p-5 rounded-2xl bg-slate-900 border border-yellow-500/30">
        <div class="text-center mb-4">
            <p id="trip-type" class="text-[10px] font-bold text-yellow-500 uppercase mb-1"></p>
            <h2 id="final-price" class="text-5xl font-black text-white">RM 0.00</h2>
        </div>
        
        <div class="space-y-2 text-xs border-t border-slate-800 pt-4">
            <div class="flex justify-between"><span>Dist/Time</span><span id="dist-label" class="text-slate-300"></span></div>
            <div class="flex justify-between"><span>Base + Km (RM1.25)</span><span id="base-km-label"></span></div>
            <div class="flex justify-between"><span>Traffic/Peak Adjustment</span><span id="peak-label"></span></div>
            <div class="flex justify-between font-bold text-yellow-500"><span>Auto-Deadhead (Return)</span><span id="dh-label"></span></div>
            <div class="flex justify-between"><span>Est. Tolls & Zone Fees</span><span id="toll-label"></span></div>
        </div>
    </div>

    <script>
        let map = L.map('map', {zoomControl: false}).setView([3.139, 101.686], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let userCoords = null, destCoords = null, markers = L.layerGroup().addTo(map);

        const PREM_ZONES = [
            { name: "KLCC/BB", lat: 3.15, lon: 101.71 },
            { name: "Mid Valley", lat: 3.11, lon: 101.67 },
            { name: "JB Sentral/CIQ", lat: 1.46, lon: 103.76 },
            { name: "Penang Core", lat: 5.41, lon: 100.32 }
        ];

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        async function getCurrentLocation() {
            navigator.geolocation.getCurrentPosition(async pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                map.setView(userCoords, 15);
                markers.clearLayers();
                L.marker(userCoords).addTo(markers);
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${userCoords[0]}&lon=${userCoords[1]}`);
                const data = await res.json();
                document.getElementById('pickup').value = data.display_name.split(',').slice(0,2).join(',');
            });
        }

        async function searchLocation(q) {
            if (q.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${q}&lat=3.13&lon=101.6`);
            const data = await res.json();
            document.getElementById('search-results').innerHTML = data.features.map(f => `
                <div class="p-3 border-b border-slate-700 text-xs" onclick="selectDest(${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}, '${f.properties.name}')">
                    ${f.properties.name}
                </div>`).join('');
        }

        function selectDest(lat, lon, name) {
            destCoords = [lat, lon];
            document.getElementById('destination').value = name;
            document.getElementById('search-results').innerHTML = '';
            L.marker(destCoords).addTo(markers);
            map.fitBounds(new L.featureGroup([L.marker(userCoords), L.marker(destCoords)]).getBounds().pad(0.3));
        }

        async function calculateFinalFare() {
            if (!userCoords || !destCoords) return alert("Select locations");
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${destCoords[1]},${destCoords[0]}`);
            const data = await res.json();
            const dist = data.routes[0].distance / 1000;
            const mins = data.routes[0].duration / 60;

            // 1. FUNDAMENTALS
            let base = 8.00;
            let kmRate = 1.25;
            let baseDistFare = base + (dist * kmRate);

            // 2. AUTO-TRAFFIC & PEAK
            let speed = dist / (mins / 60);
            let trafficMult = speed < 20 ? 1.35 : (speed < 40 ? 1.15 : 1.0);
            
            let now = new Date(), hr = now.getHours(), day = now.getDay();
            let peakMult = ((hr >= 7 && hr <= 10) || (hr >= 17 && hr <= 20)) ? 1.15 : 1.0;
            if (day === 5 && hr >= 12) peakMult = 1.25; // Friday Auto-Peak

            // 3. AUTO-DEADHEAD (Interstate Logic)
            // Automatically triggered if trip > 80km or takes > 90 mins
            let dhMult = (dist > 80 || mins > 90) ? 1.35 : 1.0;

            // 4. AUTO-TOLLS & ZONES
            let estToll = dist > 20 ? (dist * 0.14) : 0; // Average PLUS toll rate
            let zoneFee = 0;
            PREM_ZONES.forEach(z => {
                if (L.latLng(destCoords).distanceTo([z.lat, z.lon]) < 1500) zoneFee = 5.0;
            });

            // FINAL MATH
            let subtotal = baseDistFare * trafficMult * peakMult * dhMult;
            let final = subtotal + estToll + zoneFee;

            // UI
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('trip-type').innerText = dhMult > 1 ? "Interstate / Long Distance" : "Urban / Local Trip";
            document.getElementById('final-price').innerText = `RM ${final.toFixed(2)}`;
            document.getElementById('dist-label').innerText = `${dist.toFixed(1)}km / ${Math.round(mins)}m`;
            document.getElementById('base-km-label').innerText = `RM ${baseDistFare.toFixed(2)}`;
            document.getElementById('peak-label').innerText = `x${(trafficMult * peakMult).toFixed(2)} (${Math.round(speed)}km/h)`;
            document.getElementById('dh-label').innerText = dhMult > 1 ? "AUTO-APPLIED (+35%)" : "N/A";
            document.getElementById('toll-label').innerText = `RM ${(estToll + zoneFee).toFixed(2)}`;
            
            window.scrollTo(0, document.body.scrollHeight);
        }
        getCurrentLocation();
    </script>
</body>
</html>
