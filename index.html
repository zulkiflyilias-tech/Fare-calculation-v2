<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private Driver Fare Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 200px; border-radius: 12px; margin-bottom: 15px; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h1 class="text-2xl font-black text-yellow-500 tracking-tight">FARE CALCULATOR</h1>
            <p class="text-xs text-slate-400 uppercase tracking-widest">Premium Sedan Logic</p>
        </div>
        <div id="status-dot" class="h-3 w-3 bg-green-500 rounded-full animate-pulse"></div>
    </div>

    <!-- Map View -->
    <div id="map" class="shadow-2xl border border-slate-800"></div>

    <!-- Input Section -->
    <div class="space-y-4">
        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Pickup Location</label>
            <div class="flex gap-2">
                <input id="pickup" type="text" readonly class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Getting GPS...">
                <button onclick="getCurrentLocation()" class="bg-blue-600 px-4 rounded-lg">📍</button>
            </div>
        </div>

        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Destination</label>
            <input id="destination" type="text" oninput="searchLocation(this.value)" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Search Place (e.g. KLCC, Pavilion)">
            <div id="search-results" class="absolute z-[1000] w-full bg-slate-800 rounded-b-lg shadow-xl max-h-40 overflow-y-auto mt-1"></div>
        </div>

        <!-- Premium Toggles -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 flex items-center justify-between">
                <span class="text-xs">Deadhead/Rural</span>
                <input type="checkbox" id="deadhead-toggle" class="w-5 h-5 accent-yellow-500">
            </div>
            <div class="bg-slate-900 p-3 rounded-lg border border-slate-800 flex items-center justify-between">
                <span class="text-xs">Tolls (Manual)</span>
                <input type="number" id="tolls" class="w-12 bg-transparent text-right outline-none text-yellow-500" value="0.00">
            </div>
        </div>

        <button onclick="calculateFinalFare()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-black font-black py-4 rounded-xl transition-transform active:scale-95 shadow-[0_0_20px_rgba(234,179,8,0.3)]">
            GENERATE FINAL PRICE
        </button>
    </div>

    <!-- Result Card -->
    <div id="result-card" class="hidden mt-6 p-6 rounded-2xl border-2 border-yellow-500/50 bg-gradient-to-b from-slate-900 to-slate-950 shadow-2xl">
        <div class="text-center">
            <span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Total Fare Estimate</span>
            <h2 id="final-price" class="text-6xl font-black text-white mt-2">RM 0.00</h2>
        </div>
        
        <div class="mt-4 pt-4 border-t border-slate-800 space-y-2 text-sm text-slate-400">
            <div class="flex justify-between"><span>Base + Distance</span><span id="dist-label">RM 0.00</span></div>
            <div class="flex justify-between"><span>Traffic/Peak Adjustment</span><span id="peak-label">RM 0.00</span></div>
            <div class="flex justify-between text-yellow-500 font-bold"><span>Zone/Deadhead Premium</span><span id="premium-label">RM 0.00</span></div>
            <div class="flex justify-between"><span>Tolls</span><span id="toll-label">RM 0.00</span></div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([3.139, 101.686], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

        let userCoords = null;
        let destCoords = null;
        let markers = L.layerGroup().addTo(map);

        const PREM_ZONES = [
            { name: "KLCC", lat: 3.1579, lon: 101.7116 },
            { name: "Pavilion/BB", lat: 3.1485, lon: 101.7131 },
            { name: "TRX", lat: 3.1428, lon: 101.7194 },
            { name: "Mid Valley", lat: 3.1186, lon: 101.6778 },
            { name: "Mont Kiara", lat: 3.1651, lon: 101.6524 }
        ];

        function getCurrentLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                userCoords = [pos.coords.latitude, pos.coords.longitude];
                map.setView(userCoords, 15);
                markers.clearLayers();
                L.marker(userCoords).addTo(markers).bindPopup("Pickup").openPopup();
                document.getElementById('pickup').value = "Current Location Detected";
            });
        }

        async function searchLocation(query) {
            if (query.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${query}&lat=3.139&lon=101.686`);
            const data = await res.json();
            let html = '';
            data.features.forEach(f => {
                html += `<div class="p-3 border-b border-slate-700 hover:bg-slate-700 cursor-pointer text-xs" 
                         onclick="selectDestination(${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}, '${f.properties.name}')">
                         ${f.properties.name}, ${f.properties.city || ''}</div>`;
            });
            document.getElementById('search-results').innerHTML = html;
        }

        function selectDestination(lat, lon, name) {
            destCoords = [lat, lon];
            document.getElementById('destination').value = name;
            document.getElementById('search-results').innerHTML = '';
            L.marker(destCoords).addTo(markers).bindPopup("Destination").openPopup();
            const group = new L.featureGroup([L.marker(userCoords), L.marker(destCoords)]);
            map.fitBounds(group.getBounds().pad(0.5));
        }

        async function calculateFinalFare() {
            if (!userCoords || !destCoords) return alert("Please set pickup and destination");

            // 1. Get Route Data (OSRM - Free)
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${destCoords[1]},${destCoords[0]}?overview=false`);
            const data = await res.json();
            const distanceKm = data.routes[0].distance / 1000;
            const durationMin = data.routes[0].duration / 60;

            // 2. Base Calculation (KL Rates)
            let base = 10.00;
            let distCharge = distanceKm * 1.60;
            
            // 3. Traffic Tier
            let avgSpeed = distanceKm / (durationMin / 60);
            let trafficMult = 1.0;
            if (avgSpeed < 15) trafficMult = 1.35;
            else if (avgSpeed < 25) trafficMult = 1.20;

            // 4. Peak Hour Check (7-10am, 5-8pm)
            let now = new Date();
            let hour = now.getHours();
            let peakMult = ( (hour >= 7 && hour <= 10) || (hour >= 17 && hour <= 20) ) ? 1.15 : 1.0;

            // 5. Zone Premium Check
            let zonePrem = 0;
            PREM_ZONES.forEach(z => {
                let distToZone = L.latLng(destCoords).distanceTo([z.lat, z.lon]);
                if (distToZone < 1000) zonePrem = 5.00;
            });

            // 6. Deadhead Recovery
            let deadhead = document.getElementById('deadhead-toggle').checked ? 1.30 : 1.0;
            let tolls = parseFloat(document.getElementById('tolls').value) || 0;

            // FINAL MATH
            let subtotal = (base + distCharge) * trafficMult * peakMult * deadhead;
            let finalTotal = subtotal + zonePrem + tolls;

            // UI Update
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('final-price').innerText = `RM ${finalTotal.toFixed(2)}`;
            document.getElementById('dist-label').innerText = `RM ${(base + distCharge).toFixed(2)}`;
            document.getElementById('peak-label').innerText = `x${(trafficMult * peakMult).toFixed(2)}`;
            document.getElementById('premium-label').innerText = `+RM ${zonePrem + (subtotal * 0.3 - subtotal * 0)}`;
            document.getElementById('toll-label').innerText = `RM ${tolls.toFixed(2)}`;
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        getCurrentLocation();
    </script>
</body>
</html>
