<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Pengiraan Tambang Adil</title>
    
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --primary: #0056b3;
            --dark: #212529;
            --light: #f8f9fa;
            --success: #198754;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--dark);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #map {
            flex: 1;
            width: 100%;
            min-height: 35vh;
        }

        .panel {
            padding: 20px;
            background: white;
            box-shadow: 0 -3px 10px rgba(0,0,0,0.1);
            border-radius: 16px 16px 0 0;
            z-index: 1000;
            max-height: 65vh;
            overflow-y: auto;
        }

        h2 { margin-top: 0; font-size: 1.4rem; color: var(--primary); }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
        }

        /* Cadangan Autocomplete Dropdown */
        .suggestions {
            position: absolute;
            background: white;
            border: 1px solid #ccc;
            width: 100%;
            z-index: 2000;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 0 0 8px 8px;
            display: none;
        }

        .suggestions div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }

        .suggestions div:hover { background-color: #f0f0f0; }

        .btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #004085; }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #e9ecef;
            border-radius: 8px;
            display: none;
        }

        .fare-large {
            font-size: 2rem;
            font-weight: 800;
            color: var(--success);
            text-align: center;
            margin: 10px 0;
        }

        .details-table {
            width: 100%;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .details-table td { padding: 4px 0; }
        .details-table td:last-child { text-align: right; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Paparan Peta -->
    <div id="map"></div>

    <!-- Panel Kawalan / Input -->
    <div class="panel">
        <h2>Rideshare MY - Pengiraan Tambang Adil</h2>
        
        <!-- Lokasi Mula -->
        <div class="input-group">
            <label for="pickup">Lokasi Pengambilan (Pickup)</label>
            <input type="text" id="pickup" placeholder="Cari lokasi mula..." autocomplete="off">
            <div id="pickup-suggestions" class="suggestions"></div>
        </div>

        <!-- Lokasi Tamat -->
        <div class="input-group">
            <label for="dropoff">Lokasi Destinasi (Dropoff)</label>
            <input type="text" id="dropoff" placeholder="Cari destinasi..." autocomplete="off">
            <div id="dropoff-suggestions" class="suggestions"></div>
        </div>

        <!-- Tetapan Faktor Trafik / Masa Realiti -->
        <div class="input-group">
            <label for="traffic">Keadaan Trafik Semasa (Multiplier)</label>
            <select id="traffic">
                <option value="1.0">Lancar (1.0x)</option>
                <option value="1.2">Kesesakan Sederhana (1.2x)</option>
                <option value="1.5">Kesesakan Tinggi / Waktu Puncak (1.5x)</option>
                <option value="2.0">Kesesakan Melampau / Hujan Lebat (2.0x)</option>
            </select>
        </div>

        <button class="btn" onclick="kiraTambang()">Kira Estimasi Tambang</button>

        <!-- Paparan Keputusan Matematik Sebenar -->
        <div id="result" class="result-box">
            <label>Estimasi Tambang Adil (Kos Sebenar):</label>
            <div class="fare-large" id="total-fare">RM0.00</div>
            
            <table class="details-table">
                <tr><td>Jarak Anggaran:</td><td id="res-distance">0.0 km</td></tr>
                <tr><td>Masa Anggaran:</td><td id="res-time">0 minit</td></tr>
                <tr style="border-top: 1px solid #ccc;"><td colspan="2"><b>Pecahan Kos Komponen:</b></td></tr>
                <tr><td>Tambang Asas (Base):</td><td id="res-base">RM8.00</td></tr>
                <tr><td>Kos Jarak (RM1.50/km):</td><td id="res-dist-cost">RM0.00</td></tr>
                <tr><td>Kos Masa (RM0.40/min):</td><td id="res-time-cost">RM0.00</td></tr>
                <tr><td>Faktor Lonjakan (Surge):</td><td id="res-surge">1.0x</td></tr>
            </table>
        </div>
    </div>
</div>

<script>
    // 1. Inisialisasi Peta - Fokus Semenanjung Malaysia (Kuala Lumpur)
    const map = L.map('map').setView([3.1390, 101.6869], 8);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let pickupMarker, dropoffMarker, routeLine;
    let pickupCoords = null, dropoffCoords = null;

    // Tetapan Struktur Kos Cadangan Sebenar
    const KADAR_BASE = 8.00;
    const KADAR_KM = 1.50;
    const KADAR_MINIT = 0.40;

    // 2. Integrasi Geocoding Menggunakan Photon API (Percuma & Pantas)
    setupAutocomplete('pickup', 'pickup-suggestions', (coords) => {
        pickupCoords = coords;
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker([coords.lat, coords.lon], {draggable: false}).addTo(map).bindPopup("Pickup").openPopup();
        kemaskiniPandanganPeta();
    });

    setupAutocomplete('dropoff', 'dropoff-suggestions', (coords) => {
        dropoffCoords = coords;
        if (dropoffMarker) map.removeLayer(dropoffMarker);
        dropoffMarker = L.marker([coords.lat, coords.lon], {draggable: false}).addTo(map).bindPopup("Dropoff").openPopup();
        kemaskiniPandanganPeta();
    });

    function setupAutocomplete(inputId, suggestionsId, onSelect) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);

        input.addEventListener('input', debounce(async function() {
            const query = input.value;
            if (query.length < 3) { suggestionsBox.style.display = 'none'; return; }

            // Menghadkan carian geocoding sekitar Malaysia sahaja (Semenanjung fokus)
            const url = `https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&bias={{101.68,3.13}}&limit=5`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                suggestionsBox.innerHTML = '';
                
                // Tapis entiti yang berada dalam radius Malaysia sahaja
                const myFeatures = data.features.filter(f => f.properties.countrycode === 'MY');

                if(myFeatures.length === 0) { suggestionsBox.style.display = 'none'; return; }

                myFeatures.forEach(feature => {
                    const props = feature.properties;
                    const name = `${props.name || ''} ${props.street || ''} ${props.city || ''}`.trim();
                    const div = document.createElement('div');
                    div.textContent = name;
                    div.onclick = () => {
                        input.value = name;
                        suggestionsBox.style.display = 'none';
                        onSelect({ lat: feature.geometry.coordinates[1], lon: feature.geometry.coordinates[0] });
                    };
                    suggestionsBox.appendChild(div);
                });
                suggestionsBox.style.display = 'block';
            } catch (err) {
                console.error("Ralat Geocoding:", err);
            }
        }, 400));
    }

    function debounce(func, delay) {
        let timer;
        return function() {
            clearTimeout(timer);
            timer = setTimeout(() => func.apply(this, arguments), delay);
        };
    }

    function kemaskiniPandanganPeta() {
        if (pickupCoords && dropoffCoords) {
            const bounds = L.latLngBounds([pickupCoords.lat, pickupCoords.lon], [dropoffCoords.lat, dropoffCoords.lon]);
            map.fitBounds(bounds, { padding: [50, 50] });
        } else if (pickupCoords) {
            map.setView([pickupCoords.lat, pickupCoords.lon], 14);
        }
    }

    // 3. Logik Simulasi Pengiraan Menggunakan Rumus Matematik Betul (Darab)
    async function kiraTambang() {
        if (!pickupCoords || !dropoffCoords) {
            alert("Sila pilih lokasi Pickup dan Dropoff yang sah terlebih dahulu.");
            return;
        }

        // Pengiraan jarak lurus Haversine sebagai fallback pantas/estimasi asas
        const jarakKm = kiraJarakHaversine(pickupCoords.lat, pickupCoords.lon, dropoffCoords.lat, dropoffCoords.lon) * 1.3; // Tambah faktor 30% jalan raya melengkung
        
        // Anggaran masa pemanduan (Purata kelajuan bandar 40km/j)
        const masaMinit = (jarakKm / 40) * 60;

        // Ambil Nilai Multiplier dari UI
        const multiplier = parseFloat(document.getElementById('traffic').value);

        // FORMULA BETUL (Logik Pendaraban Mengikut Pembetulan Kesilapan Fail Infografik)
        const kosJarak = jarakKm * KADAR_KM;
        const kosMasa = masaMinit * KADAR_MINIT;
        const totalFare = (KADAR_BASE + kosJarak + kosMasa) * multiplier;

        // Visualisasikan garisan arah mudah pada peta
        if (routeLine) map.removeLayer(routeLine);
        routeLine = L.polyline([[pickupCoords.lat, pickupCoords.lon], [dropoffCoords.lat, dropoffCoords.lon]], {color: 'blue', weight: 4}).addTo(map);

        // Paparkan Keputusan Pada Skrin
        document.getElementById('total-fare').textContent = `RM${totalFare.toFixed(2)}`;
        document.getElementById('res-distance').textContent = `${jarakKm.toFixed(1)} km`;
        document.getElementById('res-time').textContent = `${Math.round(masaMinit)} minit`;
        document.getElementById('res-dist-cost').textContent = `RM${kosJarak.toFixed(2)}`;
        document.getElementById('res-time-cost').textContent = `RM${kosMasa.toFixed(2)}`;
        document.getElementById('res-surge').textContent = `${multiplier}x`;
        
        document.getElementById('result').style.display = 'block';
    }

    // Rumus Matematik Tulen Trigonometri untuk Estimasi Jarak Geografi
    function kiraJarakHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371; // Radius bumi dalam KM
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return R * c;
    }
</script>

</body>
</html>
