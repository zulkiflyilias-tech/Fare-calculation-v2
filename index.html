<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare Fare Estimator</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #f4f5f7; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
        .card { background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .input-container { position: relative; margin-bottom: 10px; }
        .input-container input { width: 100%; padding: 12px 35px 12px 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; outline: none; }
        .clear-btn { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; display: none; color: #888; font-weight: bold; }
        .suggestions { position: absolute; width: 100%; background: #fff; border: 1px solid #ddd; border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 1000; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .suggestion-item { padding: 10px; font-size: 13px; border-bottom: 1px solid #eee; cursor: pointer; }
        .suggestion-item:last-child { border-bottom: none; }
        .action-btns { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 10px; border: none; background: #8e24aa; color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; text-align: center; font-size: 13px; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        #map { width: 100%; height: 260px; border-radius: 12px; z-index: 1; }
        #error-msg { background: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        #result-card { display: none; }
        .fare-header { font-size: 24px; font-weight: bold; color: #2e7d32; margin-bottom: 8px; }
        .fare-meta { display: flex; gap: 15px; font-size: 13px; color: #666; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .fare-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
        .grand-row { border-top: 1px solid #ddd; padding-top: 6px; font-weight: bold; margin-top: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="input-container">
            <input type="text" id="pickup" placeholder="Enter Pickup Location" autocomplete="off">
            <span id="clear-pickup" class="clear-btn">&times;</span>
            <div id="pickup-suggestions" class="suggestions"></div>
        </div>
        
        <div class="input-container">
            <input type="text" id="dropoff" placeholder="Enter Dropoff Location" autocomplete="off">
            <span id="clear-dropoff" class="clear-btn">&times;</span>
            <div id="dropoff-suggestions" class="suggestions"></div>
        </div>

        <div class="action-btns">
            <button id="current-loc-btn" class="btn btn-secondary">🎯 Current Location</button>
            <button id="swap-btn" class="btn btn-secondary" onclick="executeLocationSwap()">⇅ Swap</button>
        </div>

        <div id="error-msg"></div>
    </div>

    <div id="map"></div>

    <div id="result-card" class="card">
        <div class="fare-header" id="total-fare">RM 0</div>
        <div class="fare-meta">
            <span>Distance: <b id="fare-distance">0 km</b></span>
            <span>Est. Time: <b id="fare-duration">0 mins</b></span>
        </div>
        
        <div class="fare-row"><span>Base Fare</span><span id="calc-base-fare">RM 0.00</span></div>
        <div class="fare-row"><span>Distance Rate</span><span id="calc-ride-distance-rate">RM 0.00</span></div>
        <div class="fare-row"><span id="toll-type-label">Tolls</span><span id="calc-tolls">RM 0.00</span></div>
        <div class="fare-row"><span>Time/Incentive</span><span id="calc-incentive">RM 0.00</span></div>
        <div class="fare-row" id="deadhead-km-row" style="display:none;"><span>Long Distance Adjust</span><span id="calc-deadhead-km">RM 0.00</span></div>
        <div class="fare-row grand-row"><span>Grand Total</span><span id="calc-grand">RM 0.00</span></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const map = L.map('map').setView([3.1390, 101.6869], 11);
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const HERE_API_KEY = "PsS2JuT4JvaMqKzOkSgQcclwn0pBP9jVcNKSC7JHmZk";

    let pickupMarker = null, dropoffMarker = null, routeLine = null;
    let pickupCoords = null, dropoffCoords = null;
    let currentRouteTimeout = null;

    function hideAllSuggestions() {
        document.querySelectorAll('.suggestions').forEach(box => {
            box.innerHTML = '';
            box.style.display = 'none';
        });
    }

    ['click', 'touchstart'].forEach(eventType => {
        document.addEventListener(eventType, function (e) {
            if (!e.target.closest('.input-container')) {
                hideAllSuggestions();
            }
        });
    });

    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (coords) => {
        pickupCoords = coords;
        updateMarker('pickup', coords);
        checkAndProcessRoute();
    }, () => {
        pickupCoords = null;
        if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        resetCalculationDisplay();
    });

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (coords) => {
        dropoffCoords = coords;
        updateMarker('dropoff', coords);
        checkAndProcessRoute();
    }, () => {
        dropoffCoords = null;
        if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        resetCalculationDisplay();
    });

    const currentLocBtn = document.getElementById('current-loc-btn');
    if (currentLocBtn) {
        currentLocBtn.addEventListener('click', () => {
            if (!navigator.geolocation) {
                showError("Location services unsupported by browser.");
                return;
            }
            currentLocBtn.textContent = "⏳";
            const errDiv = document.getElementById('error-msg');
            if (errDiv) errDiv.style.display = 'none';

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    pickupCoords = { lat, lon };
                    updateMarker('pickup', pickupCoords);
                    map.setView([lat, lon], 14);
                    
                    const revGeocodeUrl = `https://revgeocode.search.hereapi.com/v1/revgeocode?at=${lat},${lon}&lang=en-US&apiKey=${HERE_API_KEY}`;
                    
                    fetch(revGeocodeUrl)
                        .then(res => res.json())
                        .then(data => {
                            currentLocBtn.textContent = "🎯 Current Location";
                            const pInput = document.getElementById('pickup');
                            if (pInput) {
                                if (data.items && data.items.length > 0) {
                                    pInput.value = data.items[0].title || data.items[0].address.label;
                                } else {
                                    pInput.value = `Current Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                                }
                                pInput.blur();
                            }
                            const clearP = document.getElementById('clear-pickup');
                            if (clearP) clearP.style.display = 'block';
                            hideAllSuggestions();
                            checkAndProcessRoute();
                        })
                        .catch(() => {
                            currentLocBtn.textContent = "🎯 Current Location";
                            const pInput = document.getElementById('pickup');
                            if (pInput) pInput.value = `Current Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                            const clearP = document.getElementById('clear-pickup');
                            if (clearP) clearP.style.display = 'block';
                            hideAllSuggestions();
                            checkAndProcessRoute();
                        });
                },
                () => {
                    currentLocBtn.textContent = "🎯 Current Location";
                    showError("Unable to acquire location.");
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        });
    }

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeLayer(pickupMarker);
            pickupMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        } else {
            if (dropoffMarker) map.removeLayer(dropoffMarker);
            dropoffMarker = L.marker([coords.lat, coords.lon]).addTo(map);
        }
    }

    function executeLocationSwap() {
        hideAllSuggestions();
        const pickupInput = document.getElementById('pickup');
        const dropoffInput = document.getElementById('dropoff');
        if (!pickupInput || !dropoffInput) return;

        const tempText = pickupInput.value;
        const tempCoords = pickupCoords;
        
        pickupInput.value = dropoffInput.value;
        pickupCoords = dropoffCoords;
        dropoffInput.value = tempText;
        dropoffCoords = tempCoords;
        
        const clearP = document.getElementById('clear-pickup');
        const clearD = document.getElementById('clear-dropoff');
        if (clearP) clearP.style.display = pickupInput.value ? 'block' : 'none';
        if (clearD) clearD.style.display = dropoffInput.value ? 'block' : 'none';
        
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else if (pickupMarker) { map.removeLayer(pickupMarker); pickupMarker = null; }
        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else if (dropoffMarker) { map.removeLayer(dropoffMarker); dropoffMarker = null; }
        
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
        else resetCalculationDisplay();
    }

    function resetCalculationDisplay() {
        if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
        const resCard = document.getElementById('result-card');
        const errDiv = document.getElementById('error-msg');
        if (resCard) resCard.style.display = 'none';
        if (errDiv) errDiv.style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        if (errorDiv) {
            errorDiv.textContent = msg;
            errorDiv.style.display = 'block';
        }
        const resCard = document.getElementById('result-card');
        if (resCard) resCard.style.display = 'none';
    }

    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        if (!input || !suggestionsBox || !clearBtn) return;

        let debounceTimeout;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = input.value.trim();
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            if (query.length < 3) { 
                suggestionsBox.innerHTML = ''; 
                suggestionsBox.style.display = 'none';
                return; 
            }

            debounceTimeout = setTimeout(() => {
                const hereAutosuggestUrl = `https://autosuggest.search.hereapi.com/v1/autosuggest?q=${encodeURIComponent(query)}&at=3.1390,101.6869&in=countryCode:MYS&limit=5&apiKey=${HERE_API_KEY}`;
                
                fetch(hereAutosuggestUrl)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if (!data.items || data.items.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }
                        suggestionsBox.style.display = 'block';
                        
                        data.items.forEach(item => {
                            if (!item.position) return;

                            const placeTitle = item.title || (item.address ? item.address.label : '');
                            const detailedAddress = item.address ? item.address.label : placeTitle;

                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = detailedAddress;
                            
                            const selectHandler = (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                input.value = placeTitle;
                                hideAllSuggestions();
                                input.blur(); 
                                onSelect({ lat: item.position.lat, lon: item.position.lng });
                            };

                            div.addEventListener('click', selectHandler);
                            div.addEventListener('touchend', selectHandler);
                            suggestionsBox.appendChild(div);
                        });
                    }).catch(err => console.error("HERE Autosuggest Error:", err));
            }, 350);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });
    }

    function decodeFlexiblePolyline(encoded) {
        let index = 0;
        const len = encoded.length;
        
        function decodeUnsigned() {
            let res = 0, shift = 0, byte = 0;
            do {
                byte = encoded.charCodeAt(index++) - 63;
                res |= (byte & 0x1f) << shift;
                shift += 5;
            } while (byte >= 0x20);
            return res;
        }

        function decodeSigned() {
            const res = decodeUnsigned();
            return (res & 1) ? ~(res >> 1) : (res >> 1);
        }

        const header = decodeUnsigned();
        const precision = header & 15;
        const factor = Math.pow(10, precision);
        const numDims = ((header >> 4) & 7) + 2; 

        let lat = 0, lng = 0;
        const coordinates = [];

        while (index < len) {
            lat += decodeSigned();
            lng += decodeSigned();
            
            for (let i = 2; i < numDims; i++) {
                decodeSigned();
            }
            
            coordinates.push([lat / factor, lng / factor]);
        }
        return coordinates;
    }

    function fetchHERERoute() {
        const origin = `${pickupCoords.lat},${pickupCoords.lon}`;
        const destination = `${dropoffCoords.lat},${dropoffCoords.lon}`;
        const hereRouteUrl = `https://router.hereapi.com/v8/routes?transportMode=car&origin=${origin}&destination=${destination}&return=polyline,summary,tolls&apiKey=${HERE_API_KEY}`;
        
        fetch(hereRouteUrl)
            .then(res => res.json())
            .then(data => {
                if (!data.routes || data.routes.length === 0) {
                    showError("No valid drivable route found.");
                    return;
                }

                const route = data.routes[0];
                let totalDistanceMeters = 0;
                let totalDurationSeconds = 0;
                let totalTollCost = 0;
                let polylineCoords = [];

                route.sections.forEach(section => {
                    totalDistanceMeters += section.summary.length || 0;
                    totalDurationSeconds += section.summary.duration || 0;

                    if (section.polyline) {
                        const decoded = decodeFlexiblePolyline(section.polyline);
                        polylineCoords = polylineCoords.concat(decoded);
                    }

                    if (section.tolls) {
                        section.tolls.forEach(toll => {
                            if (toll.fares) {
                                toll.fares.forEach(fare => {
                                    if (fare.price && fare.price.value) {
                                        totalTollCost += fare.price.value;
                                    }
                                });
                            }
                        });
                    }
                });

                const distanceKm = totalDistanceMeters / 1000;
                const baseDurationMins = totalDurationSeconds / 60;

                const now = new Date();
                const currentHour = now.getHours();
                const isWeekend = (now.getDay() === 0 || now.getDay() === 6);

                let trafficDelayFactor = 1.15; 
                if (!isWeekend) {
                    if ((currentHour >= 7 && currentHour <= 9) || (currentHour >= 17 && currentHour <= 19.5)) {
                        trafficDelayFactor = 1.55; 
                    } else if (currentHour >= 12 && currentHour <= 14) {
                        trafficDelayFactor = 1.25; 
                    }
                } else {
                    if (currentHour >= 16 && currentHour <= 21) {
                        trafficDelayFactor = 1.35; 
                    }
                }

                let distanceImpactModifier = 1.0;
                if (distanceKm <= 5) {
                    distanceImpactModifier = 0.65;
                } else if (distanceKm <= 15) {
                    distanceImpactModifier = 0.85;
                } else if (distanceKm > 100) {
                    distanceImpactModifier = 0.35; 
                } else if (distanceKm > 50) {
                    distanceImpactModifier = 0.60;
                }

                const localizedTrafficWeight = 1 + ((trafficDelayFactor - 1) * distanceImpactModifier);
                const correctedDurationMins = Math.max(1, Math.round(baseDurationMins * localizedTrafficWeight));

                if (routeLine) map.removeLayer(routeLine);
                
                if (polylineCoords.length > 0) {
                    routeLine = L.polyline(polylineCoords, { 
                        color: '#8e24aa', weight: 5, opacity: 0.85 
                    }).addTo(map);
                    map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
                }

                processCalculations(distanceKm, correctedDurationMins, totalTollCost);
            })
            .catch(err => {
                console.error("HERE Routing API Error:", err);
                showError("Routing service unavailable. Please try again.");
            });
    }

    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        
        hideAllSuggestions();
        const errDiv = document.getElementById('error-msg');
        if (errDiv) errDiv.style.display = 'none';
        if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
        
        currentRouteTimeout = setTimeout(() => {
            fetchHERERoute();
        }, 250);
    }

    function formatDuration(totalMins) {
        if (totalMins < 60) return `${totalMins} mins`;
        const hours = Math.floor(totalMins / 60);
        const mins = totalMins % 60;
        return mins > 0 ? `${hours} hr ${mins} mins` : `${hours} hr`;
    }

    function roundToMalaysianCents(value) {
        return Math.round(value * 10) / 10;
    }

    function processCalculations(distance, duration, dynamicTolls) {
        const baseFare = 5.00;
        const perKmRate = 1.25;
        
        const chargeableDistance = Math.max(0, distance - 1);
        const rideDistanceFare = chargeableDistance * perKmRate;

        const tollLabel = document.getElementById('toll-type-label');
        if (tollLabel) tollLabel.textContent = dynamicTolls > 0 ? "Tolls (HERE API)" : "Tolls";

        const driverIncentive = (duration / 60) * 12.00;

        let deadheadCost = 0;
        const deadheadRow = document.getElementById('deadhead-km-row');
        if (distance > 12) {
            const boundaryKm = Math.min(distance, 350);
            const dynamicScalePct = ((boundaryKm - 12) / (350 - 12)) * 0.45;
            deadheadCost = rideDistanceFare * dynamicScalePct;
            if (deadheadRow) deadheadRow.style.display = 'flex';
        } else {
            if (deadheadRow) deadheadRow.style.display = 'none';
        }

        const rawTotal = baseFare + rideDistanceFare + dynamicTolls + driverIncentive + deadheadCost;
        const roundedTotal = Math.max(baseFare, roundToMalaysianCents(rawTotal));
        const finalDisplayedWholeFare = Math.round(roundedTotal);

        const setText = (id, text) => {
            const el = document.getElementById(id);
            if (el) el.textContent = text;
        };

        setText('total-fare', `RM ${finalDisplayedWholeFare}`);
        setText('fare-distance', `${distance.toFixed(1)} km`);
        setText('fare-duration', formatDuration(duration));

        setText('calc-base-fare', `RM ${baseFare.toFixed(2)}`);
        setText('calc-ride-distance-rate', `RM ${rideDistanceFare.toFixed(2)}`);
        setText('calc-tolls', `RM ${dynamicTolls.toFixed(2)}`);
        setText('calc-incentive', `RM ${driverIncentive.toFixed(2)}`);
        setText('calc-deadhead-km', `RM ${deadheadCost.toFixed(2)}`);
        setText('calc-grand', `RM ${roundedTotal.toFixed(2)}`);

        const resultCard = document.getElementById('result-card');
        if (resultCard) {
            resultCard.style.display = 'block';
            setTimeout(() => {
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }
    }
</script>
</body>
</html>
