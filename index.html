<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rideshare MY - Fare Estimator</title>
    
    <!-- HERE Maps JS API CSS -->
    <link rel="stylesheet" type="text/css" href="https://js.api.here.com/v3/3.1/mapsjs-ui.css" />
    
    <style>
        :root {
            --primary: #8e24aa;
            --primary-light: #b388ff;
            --bg-dark: #1c1c1e;
            --border-color: #e0e0e0;
            --text-dark: #212529;
            --text-muted: #aeaeb2;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden; 
            color: var(--text-dark);
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #map {
            height: 45vh;
            width: 100%;
            z-index: 1;
        }

        #search-panel {
            flex: 1;
            background: white;
            padding: 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 10;
            box-sizing: border-box;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header-row h2 {
            margin: 0 0 12px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .routing-wrapper {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: relative;
            margin-bottom: 10px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 72px 12px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(142, 36, 170, 0.1);
        }

        .action-group {
            position: absolute;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 5;
        }

        .icon-btn {
            border: none;
            background: none;
            color: #757575;
            font-size: 16px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        .clear-btn {
            display: none;
            font-size: 18px;
            color: #aaa;
        }

        .swap-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -4px 0;
            z-index: 6;
        }

        .swap-btn {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            font-size: 14px;
        }

        .swap-btn:hover {
            transform: scale(1.1);
            background-color: #fcf5ff;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 200px; 
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            display: none;
        }

        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            border-bottom: 1px solid #f5f5f5;
        }

        .suggestion-item:hover {
            background-color: #f5f5f5;
        }

        /* Mode & Option Controls */
        .route-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 4px;
            margin-bottom: 10px;
        }

        .route-mode-container {
            display: flex;
            gap: 8px;
        }

        .mode-btn {
            flex: 1;
            padding: 9px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: #f3e5f5;
            border-color: var(--primary);
            color: var(--primary);
        }

        .toggle-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: #fff3e0;
            border-color: #f57c00;
            color: #e65100;
        }

        #result-card {
            background: var(--bg-dark);
            color: white;
            padding: 16px;
            border-radius: 12px;
            margin-top: 6px;
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .fare-header {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary-light);
        }

        .fare-meta {
            font-size: 13px;
            color: #e5e5ea;
            display: flex;
            justify-content: space-between;
            font-weight: 500;
        }

        #invoice-details {
            margin-top: 12px;
            border-top: 1px dashed #3a3a3c;
            padding-top: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .detail-row.total-bold {
            color: #fff;
            font-weight: 600;
            border-top: 1px solid #2c2c2e;
            padding-top: 8px;
            margin-bottom: 0;
            font-size: 14px;
        }

        #error-msg {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 8px;
            display: none;
            font-weight: 500;
        }

        @media(min-width: 768px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 380px;
                height: 100%;
                border-radius: 0;
                box-shadow: -4px 0 20px rgba(0,0,0,0.05);
            }
        }
    </style>

    <!-- HERE Maps JS API Core Modules -->
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-core.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-service.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-ui.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js"></script>
</head>
<body>

<div id="container">
    <div id="map"></div>
    
    <div id="search-panel">
        <div class="header-row">
            <h2>Fare Estimator</h2>
        </div>
        
        <div class="routing-wrapper">
            <!-- Pickup Input -->
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Enter Pickup Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use current location">🎯</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>
            
            <!-- Swap Control -->
            <div class="swap-divider">
                <button class="swap-btn" id="swap-locations-btn" title="Swap locations" onclick="executeLocationSwap()">⇅</button>
            </div>
            
            <!-- Dropoff Input -->
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Enter Drop-off Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <!-- Route Controls -->
        <div class="route-controls">
            <div class="route-mode-container">
                <button class="mode-btn active" id="btn-mode-fast" onclick="setRoutingMode('fast')">⚡ Fastest Route</button>
                <button class="mode-btn" id="btn-mode-short" onclick="setRoutingMode('short')">📏 Shortest Route</button>
            </div>
            <button class="toggle-btn" id="btn-avoid-tolls" onclick="toggleAvoidTolls()">🛑 Avoid Tolls</button>
        </div>

        <div id="error-msg"></div>

        <!-- Result Breakdown Card -->
        <div id="result-card">
            <div class="fare-header-row">
                <div id="total-fare" class="fare-header">RM --</div>
            </div>
            <div class="fare-meta">
                <span id="fare-distance">0 km</span>
                <span id="fare-duration">0 mins</span>
            </div>
            
            <div id="invoice-details">
                <div class="detail-row">
                    <span>Base Fare</span>
                    <span id="calc-base-fare">RM 5.00</span>
                </div>
                <div class="detail-row">
                    <span>Distance Fare</span>
                    <span id="calc-ride-distance-rate">RM 0.00</span>
                </div>
                <div class="detail-row" id="toll-fare-row">
                    <span>Toll Charges</span>
                    <span id="calc-toll-fare">RM 0.00</span>
                </div>
                <div class="detail-row" id="deadhead-km-row" style="display: none;">
                    <span>Out-of-Zone Surcharge</span>
                    <span id="calc-deadhead-km">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Traffic Adjust & Incentive</span>
                    <span id="calc-incentive">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Rounded Final Total</span>
                    <span id="calc-grand" style="color: var(--primary-light);">RM 0.00</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const HERE_API_KEY = "PsS2JuT4JvaMqKzOkSgQcclwn0pBP9jVcNKSC7JHmZk"; 

    // Initialize HERE Engine
    const platform = new H.service.Platform({ 'apikey': HERE_API_KEY });
    const defaultLayers = platform.createDefaultLayers();

    // Instantiate Map centered on Klang Valley area
    const map = new H.Map(
        document.getElementById('map'),
        defaultLayers.vector.normal.map,
        { zoom: 11, center: { lat: 3.1390, lng: 101.6869 } }
    );

    window.addEventListener('resize', () => map.getViewPort().resize());

    const behavior = new H.mapevents.Behavior(new H.mapevents.MapEvents(map));
    const ui = H.ui.UI.createDefault(map, defaultLayers);
    const router = platform.getRoutingService(null, 8);

    let pickupMarker = null, dropoffMarker = null, routePolyline = null;
    let pickupCoords = null, dropoffCoords = null;
    let activeRoutingMode = 'fast'; 
    let avoidTolls = false;
    let currentRouteTimeout = null;

    // Set up Autocomplete Listeners
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (coords) => {
        pickupCoords = coords;
        updateMarker('pickup', coords);
        checkAndProcessRoute();
    }, () => clearLocation('pickup'));

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (coords) => {
        dropoffCoords = coords;
        updateMarker('dropoff', coords);
        checkAndProcessRoute();
    }, () => clearLocation('dropoff'));

    // Handle Current Location Geolocation
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showError("Geolocation is not supported by your browser.");
            return;
        }
        const btn = document.getElementById('current-loc-btn');
        btn.textContent = "⏳";
        document.getElementById('error-msg').style.display = 'none';

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude: lat, longitude: lng } = pos.coords;
                pickupCoords = { lat, lng };
                updateMarker('pickup', pickupCoords);
                map.setCenter({ lat, lng });
                map.setZoom(14);
                
                fetch(`https://revgeocode.search.hereapi.com/v1/revgeocode?at=${lat},${lng}&lang=en-US&apiKey=${HERE_API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        btn.textContent = "🎯";
                        const label = (data.items && data.items.length > 0) ? data.items[0].address.label : `Current Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                        document.getElementById('pickup').value = label;
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    })
                    .catch(() => {
                        btn.textContent = "🎯";
                        document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    });
            },
            () => {
                btn.textContent = "🎯";
                showError("Unable to retrieve location coordinates.");
            },
            { enableHighAccuracy: true, timeout: 8000 }
        );
    });

    function setRoutingMode(mode) {
        if (activeRoutingMode === mode) return;
        activeRoutingMode = mode;
        document.getElementById('btn-mode-fast').classList.toggle('active', mode === 'fast');
        document.getElementById('btn-mode-short').classList.toggle('active', mode === 'short');

        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function toggleAvoidTolls() {
        avoidTolls = !avoidTolls;
        document.getElementById('btn-avoid-tolls').classList.toggle('active', avoidTolls);

        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeObject(pickupMarker);
            pickupMarker = new H.map.Marker(coords);
            map.addObject(pickupMarker);
        } else {
            if (dropoffMarker) map.removeObject(dropoffMarker);
            dropoffMarker = new H.map.Marker(coords);
            map.addObject(dropoffMarker);
        }
    }

    function clearLocation(type) {
        if (type === 'pickup') {
            pickupCoords = null;
            if (pickupMarker) { map.removeObject(pickupMarker); pickupMarker = null; }
        } else {
            dropoffCoords = null;
            if (dropoffMarker) { map.removeObject(dropoffMarker); dropoffMarker = null; }
        }
        resetCalculationDisplay();
    }

    function executeLocationSwap() {
        const pInput = document.getElementById('pickup');
        const dInput = document.getElementById('dropoff');
        
        [pInput.value, dInput.value] = [dInput.value, pInput.value];
        [pickupCoords, dropoffCoords] = [dropoffCoords, pickupCoords];
        
        document.getElementById('clear-pickup').style.display = pInput.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dInput.value ? 'block' : 'none';
        
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else clearLocation('pickup');

        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else clearLocation('dropoff');
        
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function resetCalculationDisplay() {
        if (routePolyline) { map.removeObject(routePolyline); routePolyline = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }

    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        let debounceTimeout;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = input.value.trim();
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            if (query.length < 3) { 
                suggestionsBox.innerHTML = ''; 
                suggestionsBox.style.display = 'none';
                return; 
            }

            debounceTimeout = setTimeout(() => {
                fetch(`https://autosuggest.search.hereapi.com/v1/autosuggest?q=${encodeURIComponent(query)}&at=4.2105,101.9758&in=countryCode:MYS&limit=5&apiKey=${HERE_API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        if(!data.items || data.items.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }
                        suggestionsBox.style.display = 'block';
                        data.items.forEach(item => {
                            if (!item.position) return;
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = item.title + (item.address && item.address.label ? ` (${item.address.label})` : '');
                            
                            div.addEventListener('click', () => {
                                input.value = item.title;
                                suggestionsBox.innerHTML = '';
                                suggestionsBox.style.display = 'none';
                                onSelect({ lat: item.position.lat, lng: item.position.lng });
                            });
                            suggestionsBox.appendChild(div);
                        });
                    }).catch(console.error);
            }, 300);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });
    }

    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        
        document.getElementById('error-msg').style.display = 'none';
        if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
        
        currentRouteTimeout = setTimeout(() => {
            const params = {
                'routingMode': activeRoutingMode,
                'transportMode': 'car',
                'origin': `${pickupCoords.lat},${pickupCoords.lng}`,
                'destination': `${dropoffCoords.lat},${dropoffCoords.lng}`,
                'return': 'polyline,summary,tolls'
            };

            // Pass Avoid Tolls parameter if active
            if (avoidTolls) {
                params['avoid[features]'] = 'tollRoad';
            }

            router.calculateRoute(params, (result) => {
                if (!result.routes || result.routes.length === 0) {
                    showError("No valid route found matching selected routing preferences.");
                    return;
                }

                const section = result.routes[0].sections[0];
                const distanceKm = section.summary.length / 1000;
                const baseDurationMins = section.summary.duration / 60;

                // Consolidated Toll Fee Calculation
                let calculatedTollFee = 0;
                if (!avoidTolls) {
                    if (section.tolls) {
                        section.tolls.forEach(t => {
                            if (t.fares && t.fares[0]) calculatedTollFee += parseFloat(t.fares[0].price.value || 0);
                        });
                    } else if (section.summary.tollCosts) {
                        section.summary.tollCosts.forEach(tc => calculatedTollFee += parseFloat(tc.value || 0));
                    } else if (distanceKm > 15) {
                        calculatedTollFee = (distanceKm - 15) * 0.11; 
                    }
                }

                // Dynamic Peak-Hour Traffic Adjustment
                const now = new Date();
                const hr = now.getHours();
                const isWeekend = (now.getDay() === 0 || now.getDay() === 6);

                let trafficFactor = 1.15; 
                if (!isWeekend) {
                    if ((hr >= 7 && hr <= 9) || (hr >= 17 && hr <= 19)) trafficFactor = 1.55;
                    else if (hr >= 12 && hr <= 14) trafficFactor = 1.25;
                } else if (hr >= 16 && hr <= 21) {
                    trafficFactor = 1.35;
                }

                let distanceWeight = 1.0;
                if (distanceKm <= 5) distanceWeight = 0.65;
                else if (distanceKm <= 15) distanceWeight = 0.85;
                else if (distanceKm > 50) distanceWeight = 0.60;

                const correctedDurationMins = Math.max(1, Math.round(baseDurationMins * (1 + ((trafficFactor - 1) * distanceWeight))));

                // Draw Polyline
                if (routePolyline) map.removeObject(routePolyline);
                const linestring = H.geo.LineString.fromFlexiblePolyline(section.polyline);
                routePolyline = new H.map.Polyline(linestring, { style: { strokeColor: '#8e24aa', lineWidth: 5 } });
                
                map.addObject(routePolyline);
                map.getViewModel().setLookAtData({ bounds: routePolyline.getBoundingBox() });

                processCalculations(distanceKm, correctedDurationMins, calculatedTollFee);
            }, (error) => {
                console.error(error);
                showError("Route calculation failed with selected preferences.");
            });
        }, 200);
    }

    function processCalculations(distance, duration, tollFee) {
        const baseFare = 5.00;
        const perKmRate = 1.25;
        
        const chargeableDistance = Math.max(0, distance - 1);
        const rideDistanceFare = chargeableDistance * perKmRate;
        const driverIncentive = (duration / 60) * 12.00;

        // Out-of-Zone Surcharge Logic
        let deadheadCost = 0;
        if (distance > 12 && distance <= 50) deadheadCost = rideDistanceFare * 0.15;
        else if (distance > 50 && distance <= 250) deadheadCost = rideDistanceFare * 0.30;
        else if (distance > 250 && distance <= 500) deadheadCost = rideDistanceFare * 0.45;
        else if (distance > 500) deadheadCost = rideDistanceFare * 0.65;

        document.getElementById('deadhead-km-row').style.display = deadheadCost > 0 ? 'flex' : 'none';

        const rawTotal = baseFare + rideDistanceFare + driverIncentive + tollFee + deadheadCost;
        const roundedTotal = Math.max(baseFare, Math.round(rawTotal * 10) / 10);

        // Render Values
        document.getElementById('total-fare').textContent = `RM ${Math.round(roundedTotal)}`;
        document.getElementById('fare-distance').textContent = `${distance.toFixed(1)} km`;
        document.getElementById('fare-duration').textContent = duration < 60 ? `${duration} mins` : `${Math.floor(duration / 60)} hr ${duration % 60} mins`;

        document.getElementById('calc-base-fare').textContent = `RM ${baseFare.toFixed(2)}`;
        document.getElementById('calc-ride-distance-rate').textContent = `RM ${rideDistanceFare.toFixed(2)}`;
        document.getElementById('calc-toll-fare').textContent = `RM ${tollFee.toFixed(2)}`;
        document.getElementById('calc-deadhead-km').textContent = `RM ${deadheadCost.toFixed(2)}`;
        document.getElementById('calc-incentive').textContent = `RM ${driverIncentive.toFixed(2)}`;
        document.getElementById('calc-grand').textContent = `RM ${roundedTotal.toFixed(2)}`;

        document.getElementById('result-card').style.display = 'block';
    }
</script>
</body>
</html>
