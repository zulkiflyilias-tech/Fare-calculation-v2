<!-- Malaysia Dynamic Pricing -->
<!-- ========================= -->

<script>
const CONFIG = {
    ORS_KEY: "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=",

    RATES: {
        BASE: 5.00,

        // Urban Distance Tiers
        KM_TIER_1: 1.40,
        KM_TIER_2: 1.20,
        KM_TIER_3: 1.00,

        // Time Cost
        TIME_RATE: 0.35,

        // Interstate
        EMPTY_RETURN_KM: 0.65,

        // Rural
        RURAL_MIN: 12,
        RURAL_PICKUP_PER_KM: 0.90,

        // Waiting
        WAIT_PER_MIN: 0.50
    },

    // Peak Hours Malaysia
    PEAK_WINDOWS: [
        { start: 6, end: 10 },
        { start: 17, end: 20 }
    ],

    // Highly Congested Zones
    CONGESTED_ZONES: [
        "Kuala Lumpur",
        "Petaling Jaya",
        "Subang Jaya",
        "Shah Alam",
        "George Town",
        "Bayan Lepas",
        "Johor Bahru",
        "Mont Kiara",
        "Bangsar",
        "Bukit Bintang",
        "KLCC",
        "Mid Valley",
        "Puchong",
        "Cheras",
        "Kajang"
    ],

    // Rural Keywords
    RURAL_ZONES: [
        "Felda",
        "Kampung",
        "Estate",
        "Ladang",
        "Mukim",
        "Rural"
    ]
};

const $ = id => document.getElementById(id);

let pickupCoord,
    dropoffCoord,
    pickupState,
    dropoffState,
    pickupLabel = "",
    dropoffLabel = "",
    routeLayer,
    currentFare = 0;

function isPeakHour() {
    const now = new Date().getHours();

    return CONFIG.PEAK_WINDOWS.some(p =>
        now >= p.start && now < p.end
    );
}

function isCongestedArea(text) {
    return CONFIG.CONGESTED_ZONES.some(z =>
        text.toLowerCase().includes(z.toLowerCase())
    );
}

function isRuralArea(text) {
    return CONFIG.RURAL_ZONES.some(z =>
        text.toLowerCase().includes(z.toLowerCase())
    );
}

function getTrafficMultiplier(durationMins, distanceKm, areaText) {

    const avgSpeed = distanceKm / (durationMins / 60);

    let multiplier = 1.0;

    // Speed-based traffic model
    if (avgSpeed < 10) multiplier = 2.0;
    else if (avgSpeed < 20) multiplier = 1.6;
    else if (avgSpeed < 35) multiplier = 1.3;
    else if (avgSpeed < 50) multiplier = 1.1;

    // Additional urban congestion weighting
    if (isCongestedArea(areaText) && isPeakHour()) {
        multiplier += 0.25;
    }

    return Math.min(multiplier, 2.5);
}

function getDemandMultiplier(areaText) {

    let multiplier = 1.0;

    if (isPeakHour()) multiplier += 0.20;

    if (isCongestedArea(areaText)) multiplier += 0.20;

    return Math.min(multiplier, 2.0);
}

function getZoneType(areaText) {

    if (isRuralArea(areaText)) return "RURAL";

    if (isCongestedArea(areaText)) return "URBAN_CONGESTED";

    return "STANDARD";
}

async function calculate() {

    try {

        const res = await fetch(
            "https://api.openrouteservice.org/v2/directions/driving-car",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": CONFIG.ORS_KEY
                },
                body: JSON.stringify({
                    coordinates: [
                        [pickupCoord[1], pickupCoord[0]],
                        [dropoffCoord[1], dropoffCoord[0]]
                    ]
                })
            }
        );

        const data = await res.json();

        const route = data.routes[0];

        const km = route.summary.distance / 1000;

        const mins = Math.ceil(route.summary.duration / 60);

        const routeText =
            `${pickupLabel} ${dropoffLabel}`;

        const zoneType = getZoneType(routeText);

        // =========================
        // DISTANCE PRICING
        // =========================

        let distFare = 0;

        if (km <= 50) {

            distFare =
                km * CONFIG.RATES.KM_TIER_1;

        } else if (km <= 150) {

            distFare =
                (50 * CONFIG.RATES.KM_TIER_1) +
                ((km - 50) * CONFIG.RATES.KM_TIER_2);

        } else {

            distFare =
                (50 * CONFIG.RATES.KM_TIER_1) +
                (100 * CONFIG.RATES.KM_TIER_2) +
                ((km - 150) * CONFIG.RATES.KM_TIER_3);
        }

        // =========================
        // TIME FARE
        // =========================

        const timeFare =
            mins * CONFIG.RATES.TIME_RATE;

        // =========================
        // INTERSTATE
        // =========================

        const isInterstate =
            pickupState &&
            dropoffState &&
            pickupState !== dropoffState;

        const emptyReturn =
            isInterstate
                ? km * CONFIG.RATES.EMPTY_RETURN_KM
                : 0;

        // =========================
        // TRAFFIC MULTIPLIER
        // =========================

        const trafficMultiplier =
            getTrafficMultiplier(
                mins,
                km,
                routeText
            );

        // =========================
        // DEMAND MULTIPLIER
        // =========================

        const demandMultiplier =
            getDemandMultiplier(routeText);

        // =========================
        // SURGE
        // =========================

        const surgeMultiplier =
            trafficMultiplier *
            demandMultiplier;

        // =========================
        // RURAL PICKUP COMPENSATION
        // =========================

        let ruralFee = 0;

        if (zoneType === "RURAL") {

            ruralFee =
                Math.max(
                    CONFIG.RATES.RURAL_MIN,
                    km * CONFIG.RATES.RURAL_PICKUP_PER_KM
                );
        }

        // =========================
        // SUBTOTAL
        // =========================

        const subtotal =
            CONFIG.RATES.BASE +
            distFare +
            timeFare +
            emptyReturn;

        // =========================
        // FINAL FARE
        // =========================

        currentFare =
            (
                subtotal *
                surgeMultiplier
            ) + ruralFee;

        currentFare =
            Math.round(currentFare);

        // =========================
        // UI BADGES
        // =========================

        let badge = "STANDARD";

        if (zoneType === "RURAL")
            badge = "RURAL";

        if (isCongestedArea(routeText))
            badge = "PEAK";

        if (isInterstate)
            badge = "INTERSTATE";

        // =========================
        // UI OUTPUT
        // =========================

        $("fare").innerText =
            `RM ${currentFare}`;

        $("summary").innerHTML =
            `
            <b>${km.toFixed(1)} km</b>
            •
            <b>${mins} mins</b>
            •
            Surge ${surgeMultiplier.toFixed(2)}x
        `;

        $("badge").innerText = badge;

        // =========================
        // BREAKDOWN
        // =========================

        $("invoice-content").innerHTML = `
            <table class="invoice-table">

                <tr>
                    <td>Base Fare</td>
                    <td class="amount">
                        RM ${CONFIG.RATES.BASE.toFixed(2)}
                    </td>
                </tr>

                <tr>
                    <td>Distance Fee</td>
                    <td class="amount">
                        RM ${distFare.toFixed(2)}
                    </td>
                </tr>

                <tr>
                    <td>Time Fee</td>
                    <td class="amount">
                        RM ${timeFare.toFixed(2)}
                    </td>
                </tr>

                ${
                    isInterstate
                    ? `
                    <tr>
                        <td>Interstate Return Risk</td>
                        <td class="amount">
                            RM ${emptyReturn.toFixed(2)}
                        </td>
                    </tr>
                    `
                    : ""
                }

                ${
                    ruralFee > 0
                    ? `
                    <tr>
                        <td>Rural Compensation</td>
                        <td class="amount">
                            RM ${ruralFee.toFixed(2)}
                        </td>
                    </tr>
                    `
                    : ""
                }

                <tr>
                    <td>Traffic Multiplier</td>
                    <td class="amount">
                        ${trafficMultiplier.toFixed(2)}x
                    </td>
                </tr>

                <tr>
                    <td>Demand Multiplier</td>
                    <td class="amount">
                        ${demandMultiplier.toFixed(2)}x
                    </td>
                </tr>

                <tr style="
                    font-size:16px;
                    font-weight:800;
                    color:var(--primary)
                ">
                    <td>Total</td>
                    <td class="amount">
                        RM ${currentFare.toFixed(2)}
                    </td>
                </tr>

            </table>
        `;

        $("results").style.display = "block";

        if (routeLayer)
            map.removeLayer(routeLayer);

        routeLayer = L.polyline(
            decodePoly(route.geometry),
            {
                color: "#059669",
                weight: 6
            }
        ).addTo(map);

        map.fitBounds(
            routeLayer.getBounds(),
            {
                padding: [40, 160]
            }
        );

    } catch (e) {

        console.error(e);

    }
}

// =========================
// IMPORTANT
// MODIFY selectLoc()
// =========================

async function selectLoc(type, coord, label, state) {

    if (type === 'pickup') {

        pickupCoord = coord;
        pickupState = state;
        pickupLabel = label;

        $("pickup").value = label;

        $("p-results").style.display = 'none';

    } else {

        dropoffCoord = coord;
        dropoffState = state;
        dropoffLabel = label;

        $("dropoff").value = label;

        $("d-results").style.display = 'none';
    }

    if (pickupCoord && dropoffCoord)
        calculate();
}
</script>
