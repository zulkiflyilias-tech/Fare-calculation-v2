<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Private Sedan Fare - Malaysia Transparent Pricing</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #1a1a2e;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 24px;
            margin: 0 0 4px 0;
            color: #1a1a2e;
        }

        .subtitle {
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
            border-left: 3px solid #00a896;
            padding-left: 12px;
        }

        .fare-component {
            background: #f8f9fa;
            border-radius: 16px;
            padding: 12px;
            margin: 12px 0;
        }

        .component-line {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e9ecef;
            font-size: 14px;
        }

        .component-line.total {
            border-bottom: none;
            font-weight: 700;
            font-size: 18px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 2px solid #dee2e6;
        }

        .label {
            color: #495057;
        }

        .value {
            font-weight: 600;
            color: #212529;
        }

        .total .value {
            color: #00a896;
            font-size: 22px;
        }

        select, input {
            width: 100%;
            padding: 14px;
            border: 1.5px solid #e9ecef;
            border-radius: 12px;
            font-size: 15px;
            margin: 8px 0 12px 0;
            font-family: inherit;
            background: white;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #00a896;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 12px 0;
        }

        .checkbox-group input {
            width: auto;
            margin: 0;
        }

        button {
            background: #00a896;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s;
            margin: 8px 0;
        }

        button:active {
            transform: scale(0.98);
            background: #00897b;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .traffic-smooth { background: #d4edda; color: #155724; }
        .traffic-moderate { background: #fff3cd; color: #856404; }
        .traffic-heavy { background: #ffe5b4; color: #b85c00; }
        .traffic-severe { background: #f8d7da; color: #721c24; }

        .peak-active { background: #ffeb3b20; border-left: 4px solid #ffc107; }
        .zone-active { background: #e3f2fd; border-left: 4px solid #2196f3; }

        hr { margin: 16px 0; border: none; border-top: 1px solid #e9ecef; }

        .info-text {
            font-size: 11px;
            color: #6c757d;
            text-align: center;
            margin-top: 16px;
        }

        .location-detail {
            font-size: 12px;
            color: #00a896;
            margin-top: 4px;
            margin-bottom: 12px;
            padding: 8px;
            background: #e8f5e9;
            border-radius: 8px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .card { padding: 16px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>🚗 Malaysia Private Sedan</h1>
        <div class="subtitle">Fixed rates • No surge • Geo-zones by state law</div>

        <!-- Pickup Location -->
        <label>📍 Pickup location (state + area)</label>
        <select id="pickupState">
            <option value="">Select state</option>
            <option value="KL">Kuala Lumpur (Federal Territory)</option>
            <option value="Putrajaya">Putrajaya</option>
            <option value="Selangor">Selangor</option>
            <option value="Penang">Penang</option>
            <option value="Johor">Johor</option>
            <option value="Perak">Perak</option>
            <option value="Kedah">Kedah</option>
            <option value="Perlis">Perlis</option>
            <option value="Negeri Sembilan">Negeri Sembilan</option>
            <option value="Melaka">Melaka</option>
            <option value="Pahang">Pahang</option>
            <option value="Terengganu">Terengganu</option>
            <option value="Kelantan">Kelantan</option>
            <option value="Sabah">Sabah</option>
            <option value="Sarawak">Sarawak</option>
            <option value="Labuan">Labuan</option>
        </select>

        <select id="pickupArea">
            <option value="">Select area type</option>
        </select>
        <div id="pickupDetail" class="location-detail"></div>

        <!-- Dropoff Location -->
        <label>📍 Dropoff location (state + area)</label>
        <select id="dropoffState">
            <option value="">Select state</option>
            <option value="KL">Kuala Lumpur (Federal Territory)</option>
            <option value="Putrajaya">Putrajaya</option>
            <option value="Selangor">Selangor</option>
            <option value="Penang">Penang</option>
            <option value="Johor">Johor</option>
            <option value="Perak">Perak</option>
            <option value="Kedah">Kedah</option>
            <option value="Perlis">Perlis</option>
            <option value="Negeri Sembilan">Negeri Sembilan</option>
            <option value="Melaka">Melaka</option>
            <option value="Pahang">Pahang</option>
            <option value="Terengganu">Terengganu</option>
            <option value="Kelantan">Kelantan</option>
            <option value="Sabah">Sabah</option>
            <option value="Sarawak">Sarawak</option>
            <option value="Labuan">Labuan</option>
        </select>

        <select id="dropoffArea">
            <option value="">Select area type</option>
        </select>
        <div id="dropoffDetail" class="location-detail"></div>

        <!-- Trip Details -->
        <label>📏 Distance (km)</label>
        <input type="number" id="distance" value="15" step="0.5">

        <label>⏱️ Trip time (minutes)</label>
        <input type="number" id="timeMinutes" value="25" step="1">

        <label>🚦 Traffic speed (km/h)</label>
        <select id="trafficSpeed">
            <option value="smooth">Smooth (>40 km/h)</option>
            <option value="moderate">Moderate (25-40 km/h)</option>
            <option value="heavy">Heavy (15-25 km/h)</option>
            <option value="severe">Severe (&lt;15 km/h)</option>
        </select>

        <label>⏰ Peak hour multiplier</label>
        <select id="peakMultiplier">
            <option value="1.0">No peak (0%)</option>
            <option value="1.15">Peak +15% (6:30-9:30 AM)</option>
            <option value="1.20">Peak +20% (5:00-8:30 PM)</option>
            <option value="1.25">Friday evening +25%</option>
            <option value="1.30">Rain + peak +30%</option>
        </select>

        <div class="checkbox-group">
            <input type="checkbox" id="includeTolls">
            <label>🛣️ Include tolls/parking (+RM12)</label>
        </div>

        <button onclick="calculateFare()">💰 Calculate Fare</button>

        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <div class="card">
        <div class="info-text">
            ✅ Based on Malaysia DOSM & MCMC geotypes • Premium zones per state law<br>
            Base RM8 • Distance RM1.40/km • Driver guarantee RM14/trip
        </div>
    </div>
</div>

        },
        
        // Penang
        "Penang": {
            name: "Penang",
            premiumZone: true,
            areaOptions: {
                "island": { label: "Island Premium Zone: George Town, Batu Ferringhi, Bayan Lepas", deadheadRisk: "low", zonePremium: 6 },
                "mainland": { label: "Mainland: Seberang Perai (North, Central, South)", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Balik Pulau, Kepala Batas", deadheadRisk: "medium", zonePremium: 0 }
            }
        },
        
        // Johor
        "Johor": {
            name: "Johor",
            premiumZone: true,
            areaOptions: {
                "iskandar": { label: "Iskandar Malaysia Zone: Johor Bahru, Kulai, Pontian parts", deadheadRisk: "low", zonePremium: 6 },
                "dense_urban": { label: "Dense Urban: JB metro, Tebrau, Skudai, Pasir Gudang, Muar, Batu Pahat", deadheadRisk: "low", zonePremium: 4 },
                "rural": { label: "Rural: Segamat, Kota Tinggi, Mersing, Tangkak", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Endau-Rompin, Mersing islands", deadheadRisk: "very_high", zonePremium: 0 }

        // Perak
        "Perak": {

            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Ipoh, Taiping, Seri Manjung, Teluk Intan", deadheadRisk: "medium", zonePremium: 3 },
                "rural": { label: "Rural: Kuala Kangsar, Parit Buntar, Tapah, Kampar", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Hulu Perak (Grik, Belum-Temenggor), Lenggong", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Kedah
        "Kedah": {
            name: "Kedah",
            premiumZone: true,
            areaOptions: {
                "langkawi": { label: "Langkawi Island (Premium Duty-Free Zone)", deadheadRisk: "high", zonePremium: 5 },
                "dense_urban": { label: "Dense Urban: Alor Setar, Sungai Petani, Kulim", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Baling, Sik, Pendang, Yan, Padang Terap", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Deep forests of Sik, Baling, Langkawi outer islands", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Perlis
        "Perlis": {
            name: "Perlis",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kangar", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Arau", deadheadRisk: "high", zonePremium: 0 }
            }
        },
        
        // Negeri Sembilan
        "Negeri Sembilan": {
            name: "Negeri Sembilan",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Seremban, Senawang, Nilai", deadheadRisk: "medium", zonePremium: 2 },
                "rural": { label: "Rural: Rembau, Jelebu, Kuala Pilah, Port Dickson hinterlands", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Deep Jelebu interior, Titiwangsa range", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Melaka
        "Melaka": {
            name: "Melaka",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Melaka City, Alor Gajah", deadheadRisk: "medium", zonePremium: 2 },
                "rural": { label: "Rural: Jasin, rural hinterlands", deadheadRisk: "high", zonePremium: 0 }
            }
        },
        
        // Pahang
        "Pahang": {
            name: "Pahang",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kuantan, Temerloh, Bentong parts", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Pekan, Maran, Rompin, Raub, Jerantut, Lipis", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Taman Negara, Cameron Highlands outposts, Muadzam Shah interior", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Terengganu
        "Terengganu": {
            name: "Terengganu",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kuala Terengganu", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Besut, Marang, Dungun, Kemaman", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Hulu Terengganu (Tasik Kenyir)", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Kelantan
        "Kelantan": {
            name: "Kelantan",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kota Bharu, Kubang Kerian, Tanah Merah", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Pasir Mas, Tumpat, Bachok, Machang", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Gua Musang, Jeli deep mountain settlements", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Sabah
        "Sabah": {
            name: "Sabah",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kota Kinabalu, Sandakan, Tawau", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Penampang, Tuaran, Papar, Beaufort, Lahad Datu, Keningau", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Kinabatangan, Nabawan, Pensiangan, Tongod, Ranau, Banggi Island", deadheadRisk: "very_high", zonePremium: 0 }
            }
        },
        
        // Sarawak
        "Sarawak": {
            name: "Sarawak",
            premiumZone: false,
            areaOptions: {
                "dense_urban": { label: "Dense Urban: Kuching, Miri, Sibu, Bintulu", deadheadRisk: "medium", zonePremium: 0 },
                "rural": { label: "Rural: Bau, Serian, Sri Aman, Sarikei, Mukah, Limbang, Lawas", deadheadRisk: "high", zonePremium: 0 },
                "very_remote": { label: "Very Remote: Kapit, Belaga, Kanowit, Baram, Mulu National Park", deadheadRisk: "very_high", zonePremium: 0 }
            }
        }
    };

    // Deadhead risk multipliers
    const DEADHEAD_MULTIPLIER = {
        "low": 0.00,      // 0% - Dense urban
        "medium": 0.25,   // 25% - Nearby interstate
        "high": 0.45,     // 45% - Rural
        "very_high": 0.70 // 70% - Very remote
    };

    const CONFIG = {
        baseFare: 8.00,
        baseDistanceRate: 1.40,
        idleRatePerMin: 0.30,
        trafficMultiplier: { smooth: 1.00, moderate: 1.10, heavy: 1.20, severe: 1.35 },
        driverMinGuarantee: 14.00,
        tollsEstimate: 12.00
    };

    // Populate area dropdowns based on state selection
    function populateAreaDropdowns() {
        const pickupState = document.getElementById('pickupState').value;
        const dropoffState = document.getElementById('dropoffState').value;
        
        const pickupSelect = document.getElementById('pickupArea');
        const dropoffSelect = document.getElementById('dropoffArea');
        
        if (pickupState && MALAYSIA_ZONES[pickupState]) {
            const zones = MALAYSIA_ZONES[pickupState].areaOptions;
            pickupSelect.innerHTML = '<option value="">Select area type</option>';
            for (const [key, value] of Object.entries(zones)) {
                pickupSelect.innerHTML += `<option value="${key}">${value.label}</option>`;
            }
        } else {
            pickupSelect.innerHTML = '<option value="">Select area type</option>';
        }
        
        if (dropoffState && MALAYSIA_ZONES[dropoffState]) {
            const zones = MALAYSIA_ZONES[dropoffState].areaOptions;
            dropoffSelect.innerHTML = '<option value="">Select area type</option>';
            for (const [key, value] of Object.entries(zones)) {
                dropoffSelect.innerHTML += `<option value="${key}">${value.label}</option>`;
            }
        } else {
            dropoffSelect.innerHTML = '<option value="">Select area type</option>';
        }
        
        updateLocationDetails();
    }
    
    function updateLocationDetails() {
        const pickupState = document.getElementById('pickupState').value;
        const pickupArea = document.getElementById('pickupArea').value;
        const dropoffState = document.getElementById('dropoffState').value;
        const dropoffArea = document.getElementById('dropoffArea').value;
        
        const pickupDetail = document.getElementById('pickupDetail');
        const dropoffDetail = document.getElementById('dropoffDetail');
        
        if (pickupState && pickupArea && MALAYSIA_ZONES[pickupState]) {
            const area = MALAYSIA_ZONES[pickupState].areaOptions[pickupArea];
            pickupDetail.innerHTML = `🏷️ Premium zone: ${area.zonePremium > 0 ? 'Yes (+RM' + area.zonePremium + ')' : 'No'} • Deadhead risk: ${area.deadheadRisk}`;
        } else {
            pickupDetail.innerHTML = '';
        }
        
        if (dropoffState && dropoffArea && MALAYSIA_ZONES[dropoffState]) {
            const area = MALAYSIA_ZONES[dropoffState].areaOptions[dropoffArea];
            dropoffDetail.innerHTML = `🏷️ Premium zone: ${area.zonePremium > 0 ? 'Yes (+RM' + area.zonePremium + ')' : 'No'} • Deadhead risk: ${area.deadheadRisk}`;
        } else {
            dropoffDetail.innerHTML = '';
        }
    }
    
    function getAreaData(state, areaKey) {
        if (!state || !areaKey || !MALAYSIA_ZONES[state]) return null;
        return MALAYSIA_ZONES[state].areaOptions[areaKey] || null;
    }
    
    function getDeadheadRisk(state, areaKey) {
        const area = getAreaData(state, areaKey);
        if (!area) return "medium";
        return area.deadheadRisk;
    }
    
    function getZonePremium(state, areaKey) {
        const area = getAreaData(state, areaKey);
        if (!area) return 0;
        return area.zonePremium || 0;
    }
    
    function calculateDeadheadRate(pickupRisk, dropoffRisk) {
        const riskLevels = ["low", "medium", "high", "very_high"];
        const riskValues = { "low": 0, "medium": 1, "high": 2, "very_high": 3 };
        
        const pickupVal = riskValues[pickupRisk] || 1;
        const dropoffVal = riskValues[dropoffRisk] || 1;
        
        const maxRisk = Math.max(pickupVal, dropoffVal);
        const riskLevel = riskLevels[maxRisk];
        
        return DEADHEAD_MULTIPLIER[riskLevel] || 0.25;
    }
    
    function calculateFare() {
        const pickupState = document.getElementById('pickupState').value;
        const pickupArea = document.getElementById('pickupArea').value;
        const dropoffState = document.getElementById('dropoffState').value;
        const dropoffArea = document.getElementById('dropoffArea').value;
        
        if (!pickupState || !pickupArea || !dropoffState || !dropoffArea) {
            document.getElementById('results').innerHTML = '<div class="fare-component" style="color: red;">⚠️ Please select both pickup and dropoff locations completely</div>';
            return;
        }
        
        let distance = parseFloat(document.getElementById('distance').value);
        let timeMinutes = parseFloat(document.getElementById('timeMinutes').value);
        let trafficSpeedType = document.getElementById('trafficSpeed').value;
        let peakMultiplier = parseFloat(document.getElementById('peakMultiplier').value);
        let includeTolls = document.getElementById('includeTolls').checked;
        
        if (isNaN(distance) || distance <= 0) distance = 1;
        if (isNaN(timeMinutes) || timeMinutes <= 0) timeMinutes = 1;
        
        // Get zone data
        const pickupRisk = getDeadheadRisk(pickupState, pickupArea);
        const dropoffRisk = getDeadheadRisk(dropoffState, dropoffArea);
        const pickupPremium = getZonePremium(pickupState, pickupArea);
        const dropoffPremium = getZonePremium(dropoffState, dropoffArea);
        
        // Zone premium (higher of pickup or dropoff)
        let zonePremium = Math.max(pickupPremium, dropoffPremium);
        
        // Deadhead rate
        let deadheadRate = calculateDeadheadRate(pickupRisk, dropoffRisk);
        
        // Traffic adjustment
        let trafficMultiplier = CONFIG.trafficMultiplier[trafficSpeedType];
        let useTimeRate = (trafficSpeedType === 'severe');
        
        let effectiveDistanceRate = CONFIG.baseDistanceRate * trafficMultiplier;
        let distanceFare = distance * effectiveDistanceRate;
        
        let timeFare = useTimeRate ? timeMinutes * CONFIG.idleRatePerMin : 0;
        
        let baseFare = CONFIG.baseFare;
        let subtotal = baseFare + distanceFare + timeFare + zonePremium;
        
        let peakAmount = (baseFare + distanceFare + timeFare) * (peakMultiplier - 1);
        let totalAfterPeak = subtotal + peakAmount;
        
        let deadheadFee = distance * CONFIG.baseDistanceRate * deadheadRate;
        let tolls = includeTolls ? CONFIG.tollsEstimate : 0;
        
        let finalTotal = totalAfterPeak + deadheadFee + tolls;
        
        let driverGuaranteeAdjustment = 0;
        if (finalTotal < CONFIG.driverMinGuarantee) {
            driverGuaranteeAdjustment = CONFIG.driverMinGuarantee - finalTotal;
            finalTotal = CONFIG.driverMinGuarantee;
        }
        
        // Build results
        let resultsHtml = `
            <div class="fare-component">
                <div class="component-line">
                    <span class="label">📍 ${MALAYSIA_ZONES[pickupState]?.name} → ${MALAYSIA_ZONES[dropoffState]?.name}</span>
                    <span class="value"></span>
                </div>
                <div class="component-line">
                    <span class="label">🚗 Base fare</span>
                    <span class="value">RM ${baseFare.toFixed(2)}</span>
                </div>
                <div class="component-line">
                    <span class="label">📏 Distance (${distance} km × RM ${effectiveDistanceRate.toFixed(2)}/km)</span>
                    <span class="value">RM ${distanceFare.toFixed(2)}</span>
                </div>`;
        
        if (timeFare > 0) {
            resultsHtml += `
                <div class="component-line">
                    <span class="label">⏱️ Time/idling (${timeMinutes} min × RM ${CONFIG.idleRatePerMin}/min)</span>
                    <span class="value">RM ${timeFare.toFixed(2)}</span>
                </div>`;
        }
        
        let trafficClass = `traffic-${trafficSpeedType}`;
        let trafficLabel = { smooth: 'Smooth >40km/h', moderate: 'Moderate 25-40km/h', heavy: 'Heavy 15-25km/h', severe: 'Severe <15km/h' }[trafficSpeedType];
        
        resultsHtml += `
                <div class="component-line">
                    <span class="label">🚦 Traffic (${trafficLabel})</span>
                    <span class="value">${trafficMultiplier}x distance rate</span>
                </div>`;
        
        if (zonePremium > 0) {
            resultsHtml += `
                <div class="component-line zone-active">
                    <span class="label">🏙️ Zone premium (${MALAYSIA_ZONES[pickupState]?.name}/${MALAYSIA_ZONES[dropoffState]?.name})</span>
                    <span class="value">+RM ${zonePremium.toFixed(2)}</span>
                </div>`;
        }
        
        if (peakMultiplier > 1.0) {
            resultsHtml += `
                <div class="component-line peak-active">
                    <span class="label">⏰ Peak hour (${((peakMultiplier-1)*100).toFixed(0)}%)</span>
                    <span class="value">+RM ${peakAmount.toFixed(2)}</span>
                </div>`;
        }
        
        if (deadheadFee > 0) {
            let deadheadPercent = (deadheadRate * 100).toFixed(0);
            resultsHtml += `
                <div class="component-line">
                    <span class="label">🔄 Deadhead recovery (${deadheadPercent}% - ${pickupRisk}/${dropoffRisk} risk)</span>
                    <span class="value">RM ${deadheadFee.toFixed(2)}</span>
                </div>`;
        }
        
        if (tolls > 0) {
            resultsHtml += `
                <div class="component-line">
                    <span class="label">🛣️ Tolls/parking</span>
                    <span class="value">RM ${tolls.toFixed(2)}</span>
                </div>`;
        }
        
        if (driverGuaranteeAdjustment > 0) {
            resultsHtml += `
                <div class="component-line">
                    <span class="label">⭐ Driver minimum guarantee</span>
                    <span class="value">+RM ${driverGuaranteeAdjustment.toFixed(2)}</span>
                </div>`;
        }
        
        resultsHtml += `
                <hr>
                <div class="component-line total">
                    <span class="label">💰 TOTAL FARE</span>
                    <span class="value">RM ${finalTotal.toFixed(2)}</span>
                </div>
            </div>
            <div class="info-text">
                📋 Risk levels: Low(0%) • Medium(25%) • High(45%) • Very High(70%)<br>
                🏷️ Premium zones per Malaysian state property & zoning laws
            </div>`;
        
        document.getElementById('results').innerHTML = resultsHtml;
    }
    
    // Event listeners
    document.getElementById('pickupState').addEventListener('change', populateAreaDropdowns);
    document.getElementById('dropoffState').addEventListener('change', populateAreaDropdowns);
    document.getElementById('pickupArea').addEventListener('change', updateLocationDetails);
    document.getElementById('dropoffArea').addEventListener('change', updateLocationDetails);
    
    ['distance', 'timeMinutes', 'trafficSpeed', 'peakMultiplier', 'includeTolls'].forEach(id => {
        document.getElementById(id).addEventListener('input', calculateFare);
    });
    document.getElementById('pickupArea').addEventListener('change', calculateFare);
    document.getElementById('dropoffArea').addEventListener('change', calculateFare);
    
    window.onload = function() {
        populateAreaDropdowns();
        calculateFare();
    };
</script>
</body>
</html>
