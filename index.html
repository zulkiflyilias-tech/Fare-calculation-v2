<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petal Go - Navigation & Fare</title>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        :root {
            --petal-primary: #007dff;
            --petal-bg: #f4f6f9;
            --petal-card: #ffffff;
            --petal-text: #191919;
            --petal-text-secondary: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--petal-bg);
            color: var(--petal-text);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: 380px;
            background: var(--petal-card);
            box-shadow: 4px 0 15px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            z-index: 10;
            padding: 24px;
            box-sizing: border-box;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: var(--petal-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            position: relative;
            margin-bottom: 16px;
        }

        .input-field {
            width: 100%;
            padding: 14px 40px 14px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--petal-primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 125, 255, 0.1);
        }

        /* Toggle Switch Styling */
        .toggle-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--petal-primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        /* Fare & Route Matrix Card */
        .info-card {
            background: linear-gradient(135deg, #007dff 0%, #0056b3 100%);
            color: white;
            border-radius: 16px;
            padding: 20px;
            margin-top: auto;
            box-shadow: 0 8px 20px rgba(0, 125, 255, 0.2);
            display: none;
        }

        .info-card.active {
            display: block;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .info-row:last-child {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.2);
        }

        .info-label {
            font-size: 13px;
            opacity: 0.8;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
        }

        .fare-value {
            font-size: 24px;
            font-weight: 700;
        }

        .btn-route {
            width: 100%;
            background: var(--petal-primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-route:hover {
            background: #0066d1;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="brand">🌸 Petal Go</div>
        
        <div class="search-container">
            <input type="text" id="start-search" class="input-field" placeholder="Starting point...">
        </div>
        
        <div class="search-container">
            <input type="text" id="dest-search" class="input-field" placeholder="Where to? (Destination)">
        </div>

        <div class="toggle-container">
            <span class="toggle-label">Use Current Location as Origin</span>
            <label class="switch">
                <input type="checkbox" id="current-loc-toggle">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn-route" id="calc-route-btn">Find Route & Fare</button>

        <div class="info-card" id="fare-card">
            <div class="info-row">
                <span class="info-label">Distance</span>
                <span class="info-value" id="dist-display">0.0 km</span>
            </div>
            <div class="info-row">
                <span class="info-label">Estimated Time</span>
                <span class="info-value" id="time-display">0 mins</span>
            </div>
            <div class="info-row">
                <span class="info-label">Total Fare (RM1.50/km)</span>
                <span class="fare-value" id="fare-display">RM 0.00</span>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
        // API Configuration elements provided
        const API_KEY = "eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6ImVlYzI5ZTA0OTM2YTRlZDNhNjk1NTcyNGQ1OTJmYmNjIiwiaCI6Im11cm11cjY0In0=";
        const FARE_PER_KM = 1.50;

        // Initialize MapLibre Engine (Mimicking standard mapping layers)
        const map = new maplibregl.Map({
            container: 'map',
            style: `https://tiles.openfreemap.org/styles/bright`, // Seamless, clean global vector style
            center: [101.6869, 3.1390], // Default center layout (Kuala Lumpur context)
            zoom: 12
        });

        let startCoords = null;
        let destCoords = null;
        let currentPosition = null;

        // Obtain real-time geolocation tracking
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(position => {
                currentPosition = [position.coords.longitude, position.coords.latitude];
            });
        }

        // Toggle handling logic for starting coordinates
        document.getElementById('current-loc-toggle').addEventListener('change', async (e) => {
            const startInput = document.getElementById('start-search');
            if (e.target.checked) {
                if (currentPosition) {
                    startCoords = currentPosition;
                    startInput.disabled = true;
                    startInput.value = "Fetching your location...";
                    
                    // Reverse Geocoding call to resolve user-friendly address
                    const address = await reverseGeocode(currentPosition[1], currentPosition[0]);
                    startInput.value = address || "Current Location Saved";
                } else {
                    alert("Location permissions not allowed or unavailable.");
                    e.target.checked = false;
                }
            } else {
                startInput.disabled = false;
                startInput.value = "";
                startCoords = null;
            }
        });

        // Modularized Reverse Geocoding Routine using OpenStreetMap/Nominatim Engine
        async function reverseGeocode(lat, lon) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                const data = await response.json();
                return data.display_name.split(',').slice(0, 3).join(','); // High level context parser
            } catch (error) {
                console.error("Geocoding failed", error);
                return null;
            }
        }

        // Simple forward geocoder integration for static queries
        async function forwardGeocode(query) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
                const data = await response.json();
                if(data && data.length > 0) {
                    return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
                }
                return null;
            } catch(e) {
                return null;
            }
        }

        // Calculation event hook 
        document.getElementById('calc-route-btn').addEventListener('click', async () => {
            const destInput = document.getElementById('dest-search').value;
            const startInput = document.getElementById('start-search').value;

            if(!startCoords && startInput) {
                startCoords = await forwardGeocode(startInput);
            }
            destCoords = await forwardGeocode(destInput);

            if(!startCoords || !destCoords) {
                alert("Please declare complete valid starting and target destinations.");
                return;
            }

            // Standard OSRM Route parsing Engine to map distance vectors
            const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${startCoords[0]},${startCoords[1]};${destCoords[0]},${destCoords[1]}?overview=full&geometries=geojson`;
            
            try {
                const response = await fetch(osrmUrl);
                const data = await response.json();
                
                if(data.routes && data.routes.length > 0) {
                    const route = data.routes[0];
                    const distanceKm = route.distance / 1000;
                    const durationMins = Math.round(route.duration / 60);
                    
                    // Matrix Cost Formula calculation
                    const totalFare = distanceKm * FARE_PER_KM;

                    // UI Mutation Layer
                    document.getElementById('dist-display').innerText = `${distanceKm.toFixed(2)} km`;
                    document.getElementById('time-display').innerText = `${durationMins} mins`;
                    document.getElementById('fare-display').innerText = `RM ${totalFare.toFixed(2)}`;
                    document.getElementById('fare-card').classList.add('active');

                    // Render Geospatial Route on Map View
                    renderRoute(route.geometry);
                }
            } catch(err) {
                alert("Error configuring standard route parameters.");
            }
        });

        function renderRoute(geometry) {
            if (map.getSource('route')) {
                map.getSource('route').setData(geometry);
            } else {
                map.addSource('route', {
                    'type': 'geojson',
                    'data': geometry
                });
                map.addLayer({
                    'id': 'route',
                    'type': 'line',
                    'source': 'route',
                    'layout': { 'line-join': 'round', 'line-cap': 'round' },
                    'paint': { 'line-color': '#007dff', 'line-width': 6 }
                });
            }

            // Fit map view camera bounds elegantly over the path coordinates
            const coordinates = geometry.coordinates;
            const bounds = coordinates.reduce((acc, coord) => acc.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
            map.fitBounds(bounds, { padding: 50 });
        }
    </script>
</body>
</html>
