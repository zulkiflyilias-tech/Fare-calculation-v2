<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rideshare MY - Fare Estimator (Optimized Engine)</title>
    
    <!-- HERE Maps JS API CSS -->
    <link rel="stylesheet" type="text/css" href="https://js.api.here.com/v3/3.1/mapsjs-ui.css" />
    
    <style>
        :root {
            --primary: #8e24aa;
            --primary-light: #b388ff;
            --bg-dark: #1c1c1e;
            --border-color: #e0e0e0;
            --text-dark: #212529;
            --text-muted: #aeaeb2;
            --whatsapp-green: #25D366;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden; 
            color: var(--text-dark);
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #map {
            height: 24vh;
            width: 100%;
            z-index: 1;
        }

        #search-panel {
            flex: 1;
            background: white;
            padding: 12px 16px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
            z-index: 10;
            box-sizing: border-box;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header-row h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .routing-wrapper {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            margin-bottom: 6px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 8px 72px 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #f9f9f9;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 2px rgba(142, 36, 170, 0.1);
        }

        .action-group {
            position: absolute;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            z-index: 5;
        }

        .icon-btn {
            border: none;
            background: none;
            color: #757575;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background-color: #f0f0f0;
            color: var(--primary);
        }

        .clear-btn {
            display: none;
            font-size: 18px;
            color: #aaa;
        }

        .swap-divider {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: -4px 0;
            z-index: 6;
        }

        .swap-btn {
            background: white;
            border: 1px solid var(--border-color);
            color: var(--primary);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
            transition: transform 0.2s ease;
            font-size: 14px;
        }

        .swap-btn:hover {
            transform: scale(1.1);
            background-color: #fcf5ff;
        }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 160px; 
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
            display: none;
        }

        .suggestion-item {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 13px;
            line-height: 1.4;
            border-bottom: 1px solid #f5f5f5;
        }

        .suggestion-item:hover {
            background-color: #f5f5f5;
        }

        .route-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 2px;
            margin-bottom: 8px;
        }

        .route-mode-container {
            display: flex;
            gap: 6px;
        }

        .mode-btn {
            flex: 1;
            padding: 6px 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: #555;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
        }

        .mode-btn.active {
            background-color: #f3e5f5;
            border-color: var(--primary);
            color: var(--primary);
        }

        .toggle-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fff;
            color: #555;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background-color: #fff3e0;
            border-color: #f57c00;
            color: #e65100;
        }

        #result-card {
            background: var(--bg-dark);
            color: white;
            padding: 12px 14px;
            border-radius: 12px;
            margin-top: 2px;
            display: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.15);
        }

        .fare-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }

        .fare-header {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-light);
        }

        .fare-meta {
            font-size: 12px;
            color: #e5e5ea;
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            margin-bottom: 8px;
        }

        details {
            border-top: 1px dashed #3a3a3c;
            padding-top: 8px;
            margin-top: 6px;
        }

        summary {
            font-size: 12px;
            font-weight: 600;
            color: var(--primary-light);
            cursor: pointer;
            outline: none;
            user-select: none;
            margin-bottom: 6px;
        }

        summary:hover {
            color: #d1c4e9;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        .detail-row.total-bold {
            color: #fff;
            font-weight: 600;
            border-top: 1px solid #2c2c2e;
            padding-top: 6px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .share-btn {
            width: 100%;
            background-color: var(--whatsapp-green);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        .share-btn:hover {
            background-color: #1eb956;
        }

        #error-msg {
            color: #ff3b30;
            font-size: 13px;
            margin-top: 4px;
            display: none;
            font-weight: 500;
        }

        @media(min-width: 768px) {
            #container {
                flex-direction: row-reverse;
            }
            #map {
                height: 100%;
                flex: 1;
            }
            #search-panel {
                width: 380px;
                height: 100%;
                border-radius: 0;
                box-shadow: -4px 0 20px rgba(0,0,0,0.05);
            }
        }
    </style>

    <!-- HERE Maps JS API Core Modules -->
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-core.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-service.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-ui.js"></script>
    <script type="text/javascript" src="https://js.api.here.com/v3/3.1/mapsjs-mapevents.js"></script>
</head>
<body>

<div id="container">
    <div id="map"></div>
    
    <div id="search-panel">
        <div class="header-row">
            <h2>Fare Estimator</h2>
        </div>
        
        <div class="routing-wrapper">
            <!-- Pickup Input -->
            <div class="input-container">
                <input type="text" id="pickup" placeholder="Enter Pickup Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn" id="current-loc-btn" title="Use current location">🎯</button>
                    <button class="icon-btn clear-btn" id="clear-pickup">&times;</button>
                </div>
                <div id="pickup-suggestions" class="suggestions"></div>
            </div>
            
            <!-- Swap Control -->
            <div class="swap-divider">
                <button class="swap-btn" id="swap-locations-btn" title="Swap locations" onclick="executeLocationSwap()">⇅</button>
            </div>
            
            <!-- Dropoff Input -->
            <div class="input-container">
                <input type="text" id="dropoff" placeholder="Enter Drop-off Location..." autocomplete="off" enterkeyhint="search">
                <div class="action-group">
                    <button class="icon-btn clear-btn" id="clear-dropoff">&times;</button>
                </div>
                <div id="dropoff-suggestions" class="suggestions"></div>
            </div>
        </div>

        <!-- Route & Fare Controls -->
        <div class="route-controls">
            <!-- Mode Selection -->
            <div class="route-mode-container">
                <button class="mode-btn active" id="btn-mode-fast" onclick="setRoutingMode('fast')">⚡ Fastest Route</button>
                <button class="mode-btn" id="btn-mode-short" onclick="setRoutingMode('short')">📏 Shortest Route</button>
            </div>

            <button class="toggle-btn" id="btn-avoid-tolls" onclick="toggleAvoidTolls()">🛑 Avoid Tolls</button>
        </div>

        <div id="error-msg"></div>

        <!-- Result Breakdown Card -->
        <div id="result-card">
            <div class="fare-header-row">
                <div id="total-fare" class="fare-header">RM --</div>
            </div>
            <div class="fare-meta">
                <span id="fare-distance">0 km</span>
                <span id="fare-duration">0 mins</span>
            </div>
            
            <!-- Collapsible Driver Details (Private Breakdown) -->
            <details>
                <summary>📊 Detailed Calculation (Driver View)</summary>
                <div class="detail-row">
                    <span>Distance Fare (RM 1.30/km)</span>
                    <span id="calc-distance-fare">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Fuel Cost</span>
                    <span id="calc-fuel-cost">RM 0.00</span>
                </div>
                <div class="detail-row">
                    <span>Maintenance Cost (RM 0.13/km)</span>
                    <span id="calc-maint-cost">RM 0.00</span>
                </div>
                <div class="detail-row" id="toll-fare-row">
                    <span>Toll Charges</span>
                    <span id="calc-toll-fare">RM 0.00</span>
                </div>
                <div class="detail-row" id="return-trip-row" style="display: none;">
                    <span>Long-Haul Return Fuel & Toll</span>
                    <span id="calc-return-trip">RM 0.00</span>
                </div>
                <div class="detail-row" id="hill-surcharge-row" style="display: none;">
                    <span>Hill Surcharge</span>
                    <span id="calc-hill-surcharge">RM 0.00</span>
                </div>

                <div class="detail-row total-bold">
                    <span>Exact Calculated Total</span>
                    <span id="calc-grand" style="color: var(--primary-light);">RM 0.00</span>
                </div>
            </details>

            <!-- Copy Invoice Button -->
            <button class="share-btn" onclick="copyReceiptToClipboard()">📋 Copy Receipt Breakdown</button>
        </div>
    </div>
</div>

<script>
    const HERE_API_KEY = "PsS2JuT4JvaMqKzOkSgQcclwn0pBP9jVcNKSC7JHmZk"; 

    // Initialize HERE Engine
    const platform = new H.service.Platform({ 'apikey': HERE_API_KEY });
    const defaultLayers = platform.createDefaultLayers();

    // Instantiate Map centered on Klang Valley area
    const map = new H.Map(
        document.getElementById('map'),
        defaultLayers.vector.normal.map,
        { zoom: 11, center: { lat: 3.1390, lng: 101.6869 } }
    );

    window.addEventListener('resize', () => map.getViewPort().resize());

    const behavior = new H.mapevents.Behavior(new H.mapevents.MapEvents(map));
    const ui = H.ui.UI.createDefault(map, defaultLayers);
    const router = platform.getRoutingService(null, 8);

    let pickupMarker = null, dropoffMarker = null, routePolyline = null;
    let pickupCoords = null, dropoffCoords = null;
    let activeRoutingMode = 'fast'; 
    let avoidTolls = false;
    let lastCalculatedData = null;
    let currentRouteTimeout = null;
    let routeAbortController = null;
    let autosuggestAbortController = null;

    // Define Major Highland Destination Zones in Peninsular Malaysia
    const HIGHLAND_ZONES = [
        { lat: 3.4241, lng: 101.7933, radiusKm: 10.0, fee: 25.00, name: "Genting Highlands & Gohtong" },
        { lat: 4.4715, lng: 101.3787, radiusKm: 22.0, fee: 25.00, name: "Cameron Highlands" }, // Expanded to cover Ringlet to Brinchang/Kea Farm
        { lat: 3.7155, lng: 101.7432, radiusKm: 6.0,  fee: 25.00, name: "Fraser's Hill" },
        { lat: 3.3533, lng: 101.8385, radiusKm: 8.0,  fee: 25.00, name: "Bukit Tinggi & Colmar Tropicale" }
    ];

    function calculateHaversineDistance(lat1, lon1, lat2, lon2) {
        const R = 6371; // km
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    // Check bi-directionally: triggers surcharge if EITHER pickup or dropoff is in a highland zone
    function getHighlandZoneFee(pickup, dropoff) {
        let maxFee = 0;
        const points = [pickup, dropoff].filter(Boolean);

        points.forEach(coord => {
            HIGHLAND_ZONES.forEach(zone => {
                if (calculateHaversineDistance(coord.lat, coord.lng, zone.lat, zone.lng) <= zone.radiusKm) {
                    if (zone.fee > maxFee) maxFee = zone.fee;
                }
            });
        });

        return maxFee;
    }

    // Set up Autocomplete Listeners
    setupAutocomplete('pickup', 'pickup-suggestions', 'clear-pickup', (item) => {
        pickupCoords = { lat: item.position.lat, lng: item.position.lng };
        updateMarker('pickup', pickupCoords);
        checkAndProcessRoute();
    }, () => clearLocation('pickup'));

    setupAutocomplete('dropoff', 'dropoff-suggestions', 'clear-dropoff', (item) => {
        dropoffCoords = { lat: item.position.lat, lng: item.position.lng };
        updateMarker('dropoff', dropoffCoords);
        checkAndProcessRoute();
    }, () => clearLocation('dropoff'));

    // Handle Current Location Geolocation
    document.getElementById('current-loc-btn').addEventListener('click', () => {
        if (!navigator.geolocation) {
            showError("Geolocation is not supported by your browser.");
            return;
        }
        const btn = document.getElementById('current-loc-btn');
        btn.textContent = "⏳";
        document.getElementById('error-msg').style.display = 'none';

        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const { latitude: lat, longitude: lng } = pos.coords;
                pickupCoords = { lat, lng };
                updateMarker('pickup', pickupCoords);
                map.setCenter({ lat, lng });
                map.setZoom(14);
                
                fetch(`https://revgeocode.search.hereapi.com/v1/revgeocode?at=${lat},${lng}&lang=en-US&apiKey=${HERE_API_KEY}`)
                    .then(res => res.json())
                    .then(data => {
                        btn.textContent = "🎯";
                        if (data.items && data.items.length > 0) {
                            document.getElementById('pickup').value = data.items[0].address.label;
                        } else {
                            document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                        }
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    })
                    .catch(() => {
                        btn.textContent = "🎯";
                        document.getElementById('pickup').value = `Current Location (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
                        document.getElementById('clear-pickup').style.display = 'block';
                        checkAndProcessRoute();
                    });
            },
            () => {
                btn.textContent = "🎯";
                showError("Unable to retrieve location coordinates.");
            },
            { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
        );
    });

    function setRoutingMode(mode) {
        if (activeRoutingMode === mode) return;
        activeRoutingMode = mode;
        document.getElementById('btn-mode-fast').classList.toggle('active', mode === 'fast');
        document.getElementById('btn-mode-short').classList.toggle('active', mode === 'short');

        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function toggleAvoidTolls() {
        avoidTolls = !avoidTolls;
        document.getElementById('btn-avoid-tolls').classList.toggle('active', avoidTolls);

        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function updateMarker(type, coords) {
        if (type === 'pickup') {
            if (pickupMarker) map.removeObject(pickupMarker);
            pickupMarker = new H.map.Marker(coords);
            map.addObject(pickupMarker);
        } else {
            if (dropoffMarker) map.removeObject(dropoffMarker);
            dropoffMarker = new H.map.Marker(coords);
            map.addObject(dropoffMarker);
        }
    }

    function clearLocation(type) {
        if (type === 'pickup') {
            pickupCoords = null;
            if (pickupMarker) { map.removeObject(pickupMarker); pickupMarker = null; }
        } else {
            dropoffCoords = null;
            if (dropoffMarker) { map.removeObject(dropoffMarker); dropoffMarker = null; }
        }
        resetCalculationDisplay();
    }

    function executeLocationSwap() {
        const pInput = document.getElementById('pickup');
        const dInput = document.getElementById('dropoff');
        
        [pInput.value, dInput.value] = [dInput.value, pInput.value];
        [pickupCoords, dropoffCoords] = [dropoffCoords, pickupCoords];
        
        document.getElementById('clear-pickup').style.display = pInput.value ? 'block' : 'none';
        document.getElementById('clear-dropoff').style.display = dInput.value ? 'block' : 'none';
        
        if (pickupCoords) updateMarker('pickup', pickupCoords);
        else clearLocation('pickup');

        if (dropoffCoords) updateMarker('dropoff', dropoffCoords);
        else clearLocation('dropoff');
        
        if (pickupCoords && dropoffCoords) checkAndProcessRoute();
    }

    function resetCalculationDisplay() {
        if (routePolyline) { map.removeObject(routePolyline); routePolyline = null; }
        document.getElementById('result-card').style.display = 'none';
        document.getElementById('error-msg').style.display = 'none';
        lastCalculatedData = null;
    }

    function showError(msg) {
        const errorDiv = document.getElementById('error-msg');
        errorDiv.textContent = msg;
        errorDiv.style.display = 'block';
        document.getElementById('result-card').style.display = 'none';
    }

    function setupAutocomplete(inputId, suggestionsId, clearBtnId, onSelect, onClear) {
        const input = document.getElementById(inputId);
        const suggestionsBox = document.getElementById(suggestionsId);
        const clearBtn = document.getElementById(clearBtnId);
        let debounceTimeout;

        input.addEventListener('input', () => {
            clearTimeout(debounceTimeout);
            const query = input.value.trim();
            clearBtn.style.display = query.length > 0 ? 'block' : 'none';

            if (query.length < 3) { 
                suggestionsBox.innerHTML = ''; 
                suggestionsBox.style.display = 'none';
                return; 
            }

            debounceTimeout = setTimeout(() => {
                if (autosuggestAbortController) autosuggestAbortController.abort();
                autosuggestAbortController = new AbortController();

                fetch(`https://autosuggest.search.hereapi.com/v1/autosuggest?q=${encodeURIComponent(query)}&at=3.1390,101.6869&limit=10&apiKey=${HERE_API_KEY}`, {
                    signal: autosuggestAbortController.signal
                })
                    .then(res => res.json())
                    .then(data => {
                        suggestionsBox.innerHTML = '';
                        
                        if (!data.items || data.items.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }

                        const malaysianItems = [];
                        const otherItems = [];

                        data.items.forEach(item => {
                            if (!item.position) return;
                            const isMalaysia = item.address && (
                                item.address.countryCode === 'MYS' || 
                                (item.address.label && item.address.label.toLowerCase().includes('malaysia'))
                            );

                            if (isMalaysia) malaysianItems.push(item);
                            else otherItems.push(item);
                        });

                        const sortedItems = [...malaysianItems, ...otherItems];
                        if (sortedItems.length === 0) {
                            suggestionsBox.style.display = 'none';
                            return;
                        }
                        
                        suggestionsBox.style.display = 'block';
                        sortedItems.slice(0, 5).forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            const addressDetails = item.address && item.address.label ? ` - ${item.address.label}` : '';
                            div.textContent = item.title + addressDetails;
                            
                            div.addEventListener('click', () => {
                                input.value = item.title;
                                suggestionsBox.innerHTML = '';
                                suggestionsBox.style.display = 'none';
                                onSelect(item);
                            });
                            suggestionsBox.appendChild(div);
                        });
                    }).catch(err => {
                        if (err.name !== 'AbortError') console.error(err);
                    });
            }, 300);
        });

        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.style.display = 'none';
            suggestionsBox.innerHTML = '';
            suggestionsBox.style.display = 'none';
            onClear();
        });
    }

    function checkAndProcessRoute() {
        if (!pickupCoords || !dropoffCoords) return;
        
        document.getElementById('error-msg').style.display = 'none';
        if (currentRouteTimeout) clearTimeout(currentRouteTimeout);
        if (routeAbortController) routeAbortController.abort();
        
        routeAbortController = new AbortController();

        currentRouteTimeout = setTimeout(() => {
            if (routeAbortController.signal.aborted) return;

            const params = {
                'routingMode': activeRoutingMode,
                'transportMode': 'car',
                'origin': `${pickupCoords.lat},${pickupCoords.lng}`,
                'destination': `${dropoffCoords.lat},${dropoffCoords.lng}`,
                'departureTime': new Date().toISOString(),
                'return': 'polyline,summary,tolls,elevation'
            };

            if (avoidTolls) {
                params['avoid[features]'] = 'tollRoad';
            }

            router.calculateRoute(params, (result) => {
                if (routeAbortController.signal.aborted) return;
                if (!result.routes || result.routes.length === 0) {
                    showError("No valid route found matching selected routing preferences.");
                    return;
                }

                const section = result.routes[0].sections[0];
                const distanceKm = section.summary.length / 1000;
                let durationMins = section.summary.duration / 60;
                
                let calculatedTollFee = 0;
                if (!avoidTolls) {
                    if (section.tolls) {
                        section.tolls.forEach(t => {
                            if (t.fares && t.fares[0]) calculatedTollFee += parseFloat(t.fares[0].price.value || 0);
                        });
                    } else if (section.summary && section.summary.tollCosts) {
                        section.summary.tollCosts.forEach(tc => calculatedTollFee += parseFloat(tc.value || 0));
                    }
                }

                let maxElevation = 0;
                if (section.elevation && section.elevation.features && section.elevation.features.length > 0) {
                    const elevations = section.elevation.features.map(f => f.geometry.coordinates);
                    elevations.forEach(coord => {
                        if (coord[2] && coord[2] > maxElevation) maxElevation = coord[2];
                    });
                }

                if (routePolyline) map.removeObject(routePolyline);
                const linestring = H.geo.LineString.fromFlexiblePolyline(section.polyline);
                routePolyline = new H.map.Polyline(linestring, { style: { strokeColor: '#8e24aa', lineWidth: 5 } });
                
                map.addObject(routePolyline);
                map.getViewModel().setLookAtData({ bounds: routePolyline.getBoundingBox() });

                processCalculations(distanceKm, durationMins, calculatedTollFee, maxElevation);
            }, (error) => {
                if (routeAbortController.signal.aborted) return;
                console.error("HERE Routing API Error:", error);
                showError("Route calculation failed with selected preferences.");
            });
        }, 200);
    }

    function processCalculations(distance, duration, tollFee, maxElevation) {
        // 1. Distance Fare: RM1.30/km
        const distanceFare = distance * 1.30;

        // 2. Fuel Cost: 6L / 100km @ RM2.50/L
        const fuelCost = (distance / 100) * 6 * 2.50;

        // 3. Maintenance Cost: RM0.13/km
        const maintenanceCost = distance * 0.13;

        // 4. Hill Surcharge: Bi-directional zone check OR max elevation > 800m
        const zoneHillFee = getHighlandZoneFee(pickupCoords, dropoffCoords);
        const isHighland = zoneHillFee > 0 || maxElevation > 800;
        const hillSurcharge = isHighland ? Math.max(25.00, zoneHillFee) : 0;

        // 5. Long-haul Return Trip Fuel & Toll (>= 100km)
        let returnTripCost = 0;
        if (distance >= 100) {
            const returnFuelCost = fuelCost; // same distance back
            const returnTollCost = tollFee; // same toll back
            returnTripCost = returnFuelCost + returnTollCost;
        }

        const rawTotal = distanceFare + fuelCost + maintenanceCost + tollFee + returnTripCost + hillSurcharge;
        
        // Minimum Fare RM8 Rule
        let exactTotal = Math.max(8.00, Math.round(rawTotal * 100) / 100);
        const customerTotal = Math.round(exactTotal);

        // Display conditional rows
        document.getElementById('return-trip-row').style.display = returnTripCost > 0 ? 'flex' : 'none';
        document.getElementById('hill-surcharge-row').style.display = hillSurcharge > 0 ? 'flex' : 'none';

        // Render UI Elements
        document.getElementById('total-fare').textContent = `RM ${customerTotal}`;
        document.getElementById('fare-distance').textContent = `${distance.toFixed(1)} km`;
        document.getElementById('fare-duration').textContent = duration < 60 ? `${Math.round(duration)} mins` : `${Math.floor(duration / 60)} hr ${Math.round(duration % 60)} mins`;

        document.getElementById('calc-distance-fare').textContent = `RM ${distanceFare.toFixed(2)}`;
        document.getElementById('calc-fuel-cost').textContent = `RM ${fuelCost.toFixed(2)}`;
        document.getElementById('calc-maint-cost').textContent = `RM ${maintenanceCost.toFixed(2)}`;
        document.getElementById('calc-toll-fare').textContent = `RM ${tollFee.toFixed(2)}`;
        document.getElementById('calc-return-trip').textContent = `RM ${returnTripCost.toFixed(2)}`;
        document.getElementById('calc-hill-surcharge').textContent = `RM ${hillSurcharge.toFixed(2)}`;
        document.getElementById('calc-grand').textContent = `RM ${exactTotal.toFixed(2)}`;

        lastCalculatedData = {
            pickup: document.getElementById('pickup').value || "Pickup Point",
            dropoff: document.getElementById('dropoff').value || "Drop-off Point",
            distance: distance.toFixed(1),
            duration: Math.round(duration),
            total: customerTotal.toString()
        };

        document.getElementById('result-card').style.display = 'block';
    }

    function copyReceiptToClipboard() {
        if (!lastCalculatedData) return;

        const text = `🚗 *TRIP FARE RECEIPT ESTIMATE*\n` +
            `-----------------------------------\n` +
            `📍 *From:* ${lastCalculatedData.pickup}\n` +
            `🏁 *To:* ${lastCalculatedData.dropoff}\n` +
            `📏 *Distance:* ${lastCalculatedData.distance} km (${lastCalculatedData.duration} mins)\n` +
            `-----------------------------------\n` +
            `💰 *TOTAL FARE: RM ${lastCalculatedData.total}*\n` +
            `_*(Fare include tolls)*_\n` +
            `-----------------------------------\n` +
            `_Fare generated via Rideshare MY_`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(showCopySuccess).catch(() => fallbackCopyText(text));
        } else {
            fallbackCopyText(text);
        }
    }

    function fallbackCopyText(text) {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            const successful = document.execCommand('copy');
            if (successful) showCopySuccess();
        } catch (err) {
            console.error('Copy fallback failed:', err);
        }
        document.body.removeChild(textArea);
    }

    function showCopySuccess() {
        const shareBtn = document.querySelector('.share-btn');
        const originalText = shareBtn.innerHTML;
        shareBtn.innerHTML = "✅ Receipt Copied!";
        shareBtn.style.backgroundColor = "#1b5e20";
        setTimeout(() => {
            shareBtn.innerHTML = originalText;
            shareBtn.style.backgroundColor = "var(--whatsapp-green)";
        }, 2000);
    }
</script>
