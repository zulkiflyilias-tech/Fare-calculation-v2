<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Driver Fare Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 180px; border-radius: 12px; }
        .search-results { position: absolute; z-index: 2000; width: 100%; background: #1e293b; border-radius: 8px; max-height: 200px; overflow-y: auto; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4">

    <div class="flex justify-between items-center mb-4">
        <div>
            <h1 class="text-xl font-black text-yellow-500">PRO FARE AI</h1>
            <p id="clock" class="text-[10px] font-mono text-slate-400 uppercase tracking-widest"></p>
        </div>
        <button onclick="resetAll()" class="bg-slate-800 text-xs px-3 py-2 rounded-lg border border-slate-700 active:bg-red-900 transition-colors">RESET</button>
    </div>

    <div id="map" class="mb-4 border border-slate-800"></div>

    <div class="space-y-3 relative">
        
        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Pickup Point</label>
            <div class="flex gap-2">
                <input id="pickup" type="text" oninput="searchLoc(this.value, 'pickup')" class="flex-1 bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Enter Pickup Address...">
                <button onclick="getGPS()" class="bg-blue-600 px-4 rounded-lg">📍</button>
            </div>
            <div id="pickup-results" class="search-results hidden"></div>
        </div>

        <div class="flex justify-center -my-2 relative z-10">
            <button onclick="swapLocations()" class="bg-slate-800 p-2 rounded-full border border-slate-700 hover:bg-slate-700 shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M11.5 15a.5.5 0 0 0 .5-.5V2.707l3.146 3.147a.5.5 0 0 0 .708-.708l-4-4a.5.5 0 0 0-.708 0l-4 4a.5.5 0 1 0 .708.708L11 2.707V14.5a.5.5 0 0 0 .5.5zm-7-14a.5.5 0 0 1 .5.5v11.793l3.146-3.147a.5.5 0 0 1 .708.708l-4 4a.5.5 0 0 1-.708 0l-4-4a.5.5 0 0 1 .708-.708L4 13.293V1.5a.5.5 0 0 1 .5-.5z"/></svg>
            </button>
        </div>

        <div class="relative">
            <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Destination</label>
            <input id="destination" type="text" oninput="searchLoc(this.value, 'dest')" class="w-full bg-slate-900 border border-slate-800 p-3 rounded-lg text-sm" placeholder="Enter Destination...">
            <div id="dest-results" class="search-results hidden"></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Travel Schedule</label>
                <input id="schedule" type="datetime-local" onchange="calculate()" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-xs text-yellow-500">
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase ml-2">Manual Tolls (RM)</label>
                <input id="tolls" type="number" oninput="calculate()" class="w-full bg-slate-900 border border-slate-800 p-2 rounded-lg text-sm text-right" value="0.00">
            </div>
        </div>
    </div>

    <div id="result-card" class="hidden mt-6 p-5 rounded-2xl bg-gradient-to-b from-slate-900 to-black border border-yellow-500/40">
        <div class="text-center mb-4">
            <p id="trip-type" class="text-[9px] font-bold text-yellow-500 uppercase tracking-widest"></p>
            <h2 id="final-price" class="text-5xl font-black text-white">RM 0.00</h2>
        </div>
        
        <div class="space-y-2 text-xs border-t border-slate-800 pt-4">
            <div class="flex justify-between text-slate-400"><span>Distance / Time</span><span id="dist-label" class="text-slate-100"></span></div>
            <div class="flex justify-between text-slate-400"><span>Base Rate (RM1.25/km)</span><span id="base-km-label" class="text-slate-100"></span></div>
            <div class="flex justify-between text-slate-400"><span>Traffic & Schedule Adj.</span><span id="peak-label" class="text-slate-100"></span></div>
            <div class="flex justify-between font-bold text-yellow-500"><span>Auto-Deadhead (Return)</span><span id="dh-label"></span></div>
            <div class="flex justify-between text-slate-400"><span>Tolls & Zone Surcharge</span><span id="toll-label" class="text-slate-100"></span></div>
        </div>
    </div>

    <script>
        let map = L.map('map', {zoomControl: false}).setView([3.139, 101.686], 11);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
        let uLat, uLon, dLat, dLon, markers = L.layerGroup().addTo(map);

        // Set default time to NOW
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        document.getElementById('schedule').value = now.toISOString().slice(0,16);

        function resetAll() { location.reload(); }

        function swapLocations() {
            let pVal = document.getElementById('pickup').value;
            let dVal = document.getElementById('destination').value;
            document.getElementById('pickup').value = dVal;
            document.getElementById('destination').value = pVal;
            [uLat, dLat] = [dLat, uLat];
            [uLon, dLon] = [dLon, uLon];
            calculate();
        }

        async function getGPS() {
            navigator.geolocation.getCurrentPosition(async pos => {
                uLat = pos.coords.latitude; uLon = pos.coords.longitude;
                map.setView([uLat, uLon], 15);
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${uLat}&lon=${uLon}`);
                const data = await res.json();
                document.getElementById('pickup').value = data.display_name.split(',').slice(0,4).join(',');
                calculate();
            });
        }

        async function searchLoc(q, type) {
            if (q.length < 3) return;
            const res = await fetch(`https://photon.komoot.io/api/?q=${q}&lat=3.13&lon=101.6`);
            const data = await res.json();
            const resultsDiv = document.getElementById(type + '-results');
            resultsDiv.classList.remove('hidden');
            resultsDiv.innerHTML = data.features.map(f => `
                <div class="p-3 border-b border-slate-700 text-xs hover:bg-slate-700" onclick="select('${type}', ${f.geometry.coordinates[1]}, ${f.geometry.coordinates[0]}, '${f.properties.name}, ${f.properties.city || ''}')">
                    ${f.properties.name}, ${f.properties.city || ''}
                </div>`).join('');
        }

        function select(type, lat, lon, name) {
            if (type === 'pickup') { uLat = lat; uLon = lon; document.getElementById('pickup').value = name; }
            else { dLat = lat; dLon = lon; document.getElementById('destination').value = name; }
            document.getElementById(type + '-results').classList.add('hidden');
            calculate();
        }

        async function calculate() {
            if (!uLat || !dLat) return;
            
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${uLon},${uLat};${dLon},${dLat}`);
            const data = await res.json();
            if (data.code !== 'Ok') return;

            const dist = data.routes[0].distance / 1000;
            const mins = data.routes[0].duration / 60;
            
            // 1. BASE MATH
            let base = 8.00;
            let baseFare = base + (dist * 1.25);

            // 2. SMART TRAFFIC
            let speed = dist / (mins / 60);
            let trafficMult = speed < 20 ? 1.35 : (speed < 40 ? 1.15 : 1.0);

            // 3. SCHEDULE LOGIC
            let SchedDate = new Date(document.getElementById('schedule').value);
            let hr = SchedDate.getHours();
            let day = SchedDate.getDay();
            let peakMult = ((hr >= 7 && hr <= 10) || (hr >= 17 && hr <= 20)) ? 1.15 : 1.0;
            if (day === 5 && hr >= 12) peakMult = 1.25;

            // 4. AUTO DEADHEAD
            let dhMult = (dist > 80) ? 1.35 : 1.0;

            // 5. TOLLS & ZONES
            let manualToll = parseFloat(document.getElementById('tolls').value) || 0;
            let estToll = dist > 30 ? (dist * 0.12) : 0; // Auto-estimate if > 30km
            let zoneFee = (dLat < 3.16 && dLat > 3.12 && dLon > 101.69 && dLon < 101.72) ? 5.00 : 0;

            // TOTAL
            let subtotal = baseFare * trafficMult * peakMult * dhMult;
            let final = subtotal + manualToll + estToll + zoneFee;

            // UI UPDATES
            markers.clearLayers();
            L.marker([uLat, uLon]).addTo(markers);
            L.marker([dLat, dLon]).addTo(markers);
            map.fitBounds(new L.featureGroup([L.marker([uLat, uLon]), L.marker([dLat, dLon])]).getBounds().pad(0.2));

            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('trip-type').innerText = dhMult > 1 ? "Interstate / Remote Trip" : "Urban / Local Trip";
            document.getElementById('final-price').innerText = `RM ${final.toFixed(2)}`;
            document.getElementById('dist-label').innerText = `${dist.toFixed(1)}km / ${Math.round(mins)}m`;
            document.getElementById('base-km-label').innerText = `RM ${baseFare.toFixed(2)}`;
            document.getElementById('peak-label').innerText = `x${(trafficMult * peakMult).toFixed(2)} (${Math.round(speed)}km/h)`;
            document.getElementById('dh-label').innerText = dhMult > 1 ? "AUTO-ACTIVE (+35%)" : "N/A";
            document.getElementById('toll-label').innerText = `RM ${(manualToll + estToll + zoneFee).toFixed(2)}`;
        }

        getGPS();
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleString(); }, 1000);
    </script>
</body>
</html>
